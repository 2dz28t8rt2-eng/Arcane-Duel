name: Arcane Duel - v15.79 Second Drawer vs Seat Bias
on:
  push:
    branches: [development]
    paths: ['.github/workflows/ai-v1579-second-drawer-seat.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  preflight:
    name: Check combat, draw-order sixth-card control and sealed TRAIN priors
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Legal fusion and Predator combat regression checks
        run: |
          set -euo pipefail
          node --check tests/ai-v1579-second-drawer-seat.cjs
          node --check tests/ai-v1579-second-drawer-seat-aggregate.cjs
          node --test tests/ai-v1575-counterplay.test.cjs tests/ai-v1574-stomp.test.cjs tests/fusion-stomp-v200.test.cjs tests/essence-combat.test.cjs tests/predator-pack-v198.test.cjs
          node tests/helpers/game-runtime.cjs
      - name: Download independently verified TRAIN-only priors
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/40513311546" --jq '.conclusion')" = success
          mkdir -p /tmp/arcane-v1579-priors artifacts/v1579-priors
          gh run download 40513311546 --repo "$GITHUB_REPOSITORY" --name arcane-v14972-counterplay --dir /tmp/arcane-v1579-priors
          for f in historical-train.json frozen-v1555-champion.json incumbent-policy.json older-q-checkpoint.json previous-training-q.json prior-selfplay-checkpoint.json provenance.json research-balanced-policy.json v1499-prior-q.json endgame-learner.json training-q-and-examples.json; do
            test -s "/tmp/arcane-v1579-priors/$f"
            cp "/tmp/arcane-v1579-priors/$f" "artifacts/v1579-priors/$f"
          done
          node - <<'JS'
          const a=require('node:assert/strict'),x=require('./artifacts/v1579-priors/endgame-learner.json');
          a.equal(x.sourceRun,40499008498);
          a.equal(x.split,'train');a.equal(x.holdoutUsed,false);a.equal(x.validationUsed,false);
          console.log('ARCANE_V1579_PRIORS_SEALED');
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: arcane-v1579-verified-priors
          path: artifacts/v1579-priors/
          retention-days: 90
  research:
    name: second-drawer-extra-${{ matrix.extra }} / stage-${{ matrix.stage }}
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        extra: [0, 1]
        stage: [9, 10]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: arcane-v1579-verified-priors
          path: artifacts/v1579/second${{ matrix.extra }}
      - name: Execute matched 40-card duels with both seats on same policy
        env:
          ARCANE_V1579_SECOND_EXTRA: ${{ matrix.extra }}
          ARCANE_STAGE: ${{ matrix.stage }}
        run: |
          set -euo pipefail
          for pair in 0 1 2 3 4 5 6 7; do
            for chunk in 0 1; do
              node --expose-gc --max-old-space-size=2400 tests/ai-v1579-second-drawer-seat.cjs "$ARCANE_STAGE" "$pair" "$chunk"
            done
          done
          node --max-old-space-size=3200 tests/ai-v1579-second-drawer-seat.cjs "$ARCANE_STAGE" finalize
      - name: Preserve partial research shards after failure
        if: always()
        env:
          ARCANE_V1579_SECOND_EXTRA: ${{ matrix.extra }}
          ARCANE_STAGE: ${{ matrix.stage }}
        run: |
          set -euo pipefail
          dir="second${ARCANE_V1579_SECOND_EXTRA}"
          mkdir -p "artifacts/v1579-export/$dir"
          find "artifacts/v1579/$dir" -maxdepth 1 -name "stage-$ARCANE_STAGE*" -type f -exec cp {} "artifacts/v1579-export/$dir/" \;
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arcane-v1579-stage-second${{ matrix.extra }}-${{ matrix.stage }}
          path: artifacts/v1579-export/
          retention-days: 90
          if-no-files-found: warn
  aggregate:
    name: Audit actual second-to-act compensation vs seat and starter confounding
    needs: [preflight, research]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: arcane-v1579-stage-*
          merge-multiple: true
          path: artifacts/v1579
      - name: Compute paired, two-role, by-seat causal comparison
        run: node --max-old-space-size=3200 tests/ai-v1579-second-drawer-seat-aggregate.cjs
      - name: Assert 9216 full duels and genuine sixth-card conditions
        run: |
          node - <<'JS'
          const a=require('node:assert/strict'),r=require('./artifacts/v1579/report.json');
          a.equal(r.status,'completed');a.equal(r.totalDuels,9216);
          a.equal(r.candidateDuels,1536);
          a.equal(r.controls.exactStartingHandsVerified,true);
          a.equal(r.controls.secondMoverRegardlessOfSeat,true);
          a.equal(r.controls.candidateAndOpponentSamePolicy,true);
          a.equal(r.validationDecision.holdoutOpenedAfterDecision,true);
          a.equal(r.validationDecision.noAutomaticRuleChange,true);
          console.log('ARCANE_V1579_SECOND_DRAWER_RESEARCH_COMPLETE');
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arcane-v1579-second-drawer-9216-report
          path: artifacts/v1579/report.json
          retention-days: 90
          if-no-files-found: warn
