name: Arcane Duel - NPC ACE Strong Deck Stress v10.5
on:
  push:
    branches: [development]
    paths:
      - 'tests/ai-real-npc-ace-stress-v105.cjs'
      - '.github/workflows/ai-npc-ace-stress-v105.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  late-deck-npc-ace-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate script syntax
        run: node --check tests/ai-real-npc-ace-stress-v105.cjs
      - name: Test 256 legal ACE action matches against strong X proxy decks
        run: node tests/ai-real-npc-ace-stress-v105.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arcane-npc-ace-stress-v105
          path: artifacts/ai-real-npc-ace-stress-v105.json
          if-no-files-found: warn
          retention-days: 30
