name: Arcane Duel - v13.3 Multi-Deck Strategy Training IX X
on:
  push:
    branches: [development]
    paths:
      - 'tests/ai-robust-multideck-v133.cjs'
      - '.github/workflows/ai-robust-multideck-v133.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: arcane-ai-v133-${{ github.ref }}
  cancel-in-progress: false
jobs:
  robust-multideck-learning:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate engine regression and policy source
        run: |
          node --check tests/ai-robust-multideck-v133.cjs
          node --test tests/ai-history-v130.test.cjs tests/ai-board-planner-v129.test.cjs
      - name: Retrieve genuine prior trained attack model
        uses: actions/download-artifact@v4
        with:
          name: arcane-v131-rule-learning-and-lookahead
          repository: 2dz28t8rt2-eng/Arcane-Duel
          run-id: 39627739090
          github-token: ${{ github.token }}
          path: artifacts/v131
      - name: Retrieve frozen v13.2 strategy weights
        uses: actions/download-artifact@v4
        with:
          name: arcane-v132-ix-x-trained-board-ace-policy
          repository: 2dz28t8rt2-eng/Arcane-Duel
          run-id: 39629620617
          github-token: ${{ github.token }}
          path: artifacts/v132
      - name: Pilot varied deck training and fresh holdouts
        env:
          ARCANE_V133_TRAIN_REPEAT: '1'
          ARCANE_V133_HOLDOUT_REPEAT: '1'
          ARCANE_V133_CANDIDATES: '3'
        run: node tests/ai-robust-multideck-v133.cjs
      - name: Full diverse IX X strategy training with untouched seven-role evaluation
        env:
          ARCANE_V133_TRAIN_REPEAT: '2'
          ARCANE_V133_HOLDOUT_REPEAT: '3'
          ARCANE_V133_CANDIDATES: '12'
        run: node tests/ai-robust-multideck-v133.cjs
      - name: Archive frozen policy weights and multi-archetype holdout by boss
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arcane-v133-robust-multideck-policy-report
          path: |
            artifacts/ai-v133-multideck-report.json
            artifacts/ai-v133-frozen-policy.json
          retention-days: 60
          if-no-files-found: warn
