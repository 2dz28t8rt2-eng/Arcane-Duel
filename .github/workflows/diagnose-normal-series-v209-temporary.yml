name: Temporary Normal Card Series Diagnostic v20.9
on:
  push:
    branches: [development]
    paths:
      - '.github/workflows/diagnose-normal-series-v209-temporary.yml'
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run the exact isolated normal-card series regression
        run: node --test tests/update-a-level-series.test.cjs
