name: Arcane Duel - Tactical Fusion Player AI v8.5
on:
  push:
    branches: [development]
    paths:
      - 'tests/ai-earned-preiv-v85.cjs'
      - 'tests/ai-tactical-training-v85.cjs'
      - 'tests/helpers/ai-tactical-v85.cjs'
      - '.github/workflows/ai-tactical-v85.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tactical-fusion-holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and game invariant checks
        run: |
          node --check tests/ai-earned-preiv-v85.cjs
          node --check tests/ai-tactical-training-v85.cjs
          node --check tests/helpers/ai-tactical-v85.cjs
          node --test tests/ai-fusion-choice-v61.test.cjs tests/ai-fusion-preservation-v62.test.cjs tests/monster-roles-forge.test.cjs tests/shard-rework-v77.test.cjs tests/regression.test.cjs
      - name: Earn 32 fully legal and distinct player pre-IV inventories
        env:
          ARCANE_V85_CAREERS: '32'
          ARCANE_V85_TIER_ATTEMPTS: '16'
        run: node tests/ai-earned-preiv-v85.cjs
      - name: Train and validate matched tactical fusion variants
        env:
          ARCANE_V85_CAREERS: '32'
          ARCANE_V85_MATCH_SEEDS: '2'
        run: node tests/ai-tactical-training-v85.cjs
      - name: Additional AI strategy and action legality regression
        run: node --test tests/ai-revamp-v55.test.cjs tests/ai-decision-diagnostics-v62.test.cjs tests/ai-fusion-choice-v61.test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arcane-tactical-ai-v85
          path: |
            artifacts/ai-earned-preiv-v85.json
            artifacts/ai-tactical-v85.json
          if-no-files-found: warn
          retention-days: 30
