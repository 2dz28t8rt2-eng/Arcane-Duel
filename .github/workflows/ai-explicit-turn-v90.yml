name: Arcane Duel - Explicit Turn Controller AI v9.0
on:
  push:
    branches: [development]
    paths:
      - 'tests/ai-earned-preiv-v90.cjs'
      - 'tests/ai-explicit-turn-v90.cjs'
      - 'tests/helpers/ai-turn-controller-v90.cjs'
      - '.github/workflows/ai-explicit-turn-v90.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  explicit-phase-holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check code syntax and real deck/combat invariants
        run: |
          node --check tests/ai-earned-preiv-v90.cjs
          node --check tests/ai-explicit-turn-v90.cjs
          node --check tests/helpers/ai-turn-controller-v90.cjs
          node --test tests/ai-fusion-choice-v61.test.cjs tests/ai-fusion-preservation-v62.test.cjs tests/shard-rework-v77.test.cjs tests/monster-roles-forge.test.cjs tests/regression.test.cjs
      - name: Earn independent legal career profiles for NPC IV
        env:
          ARCANE_V90_CAREERS: '32'
          ARCANE_V90_TIER_ATTEMPTS: '16'
        run: node tests/ai-earned-preiv-v90.cjs
      - name: Train seven legal turn-controller policies in 896 matched games
        env:
          ARCANE_V90_CAREERS: '32'
          ARCANE_V90_MATCH_SEEDS: '2'
        run: node tests/ai-explicit-turn-v90.cjs
      - name: AI and legal action regression tests
        run: node --test tests/ai-revamp-v55.test.cjs tests/ai-decision-diagnostics-v62.test.cjs tests/ai-fusion-choice-v61.test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arcane-explicit-turn-v90
          path: |
            artifacts/ai-earned-preiv-v90.json
            artifacts/ai-defender-coverage-v90.json
          if-no-files-found: warn
          retention-days: 30
