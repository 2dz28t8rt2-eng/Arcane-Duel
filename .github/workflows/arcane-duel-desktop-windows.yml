name: Arcane Duel – portable Windows app

on:
  push:
    branches: [development]
    paths:
      - 'desktop/**'
      - '.github/workflows/arcane-duel-desktop-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-portable:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout development
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install desktop dependencies
        run: npm ci --prefix desktop
      - name: Test desktop security and navigation
        run: npm run --prefix desktop test
      - name: Build portable Windows EXE
        run: npm run --prefix desktop dist:portable
      - name: Upload downloadable desktop app
        uses: actions/upload-artifact@v4
        with:
          name: ArcaneDuel-Desktop-Portable-Windows
          path: desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 21
