name: Arcane Duel – Install 10 Original Monster Artworks v11.7
on:
  push:
    branches: [development]
    paths:
      - '.github/workflows/install-lategame-art-v117.yml'
      - 'assets/custom-art/Arcane-Duel-10-Monster-Artworks-ohne-Effekte-v117.zip'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: arcane-lategame-art-v117
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
          persist-credentials: true
      - name: Install verified original WebP images and activate both catalogues
        run: |
          python3 - <<'PY'
          import hashlib, io, json, zipfile
          from pathlib import Path
          import struct
          archive=Path('assets/custom-art/Arcane-Duel-10-Monster-Artworks-ohne-Effekte-v117.zip')
          expected='be130e85b1fd21e84c796cf322ebfb2e07adbc110f2575fc667f55c2c5819b07'
          if not archive.is_file() or hashlib.sha256(archive.read_bytes()).hexdigest()!=expected:
              raise SystemExit('Uploaded v11.7 archive does not match the verified original ZIP')
          manifest=json.loads(Path('assets/lategame-v117-manifest.json').read_text('utf-8'))
          rows=manifest['cards']
          if len(rows)!=10 or [r['id'] for r in rows]!=list(range(732,742)):
              raise SystemExit('Unrecognized ten-card manifest')
          paths={r['art'] for r in rows}
          if len(paths)!=10 or any(not p.startswith('assets/custom-art/lategame-v117/') or not p.endswith('.webp') for p in paths):
              raise SystemExit('Unexpected image locations')
          digest=set()
          with zipfile.ZipFile(archive) as z:
              all_entries={x.filename for x in z.infolist() if not x.is_dir()}
              if all_entries != paths | {'manifest.json','INSTALLATION.md'}:
                  raise SystemExit('Archive entries do not match the manifest: '+str(sorted(all_entries^paths)))
              for r in rows:
                  p=r['art']
                  data=z.read(p)
                  if (len(data)<70000 or data[:4]!=b'RIFF' or data[8:12]!=b'WEBP'
                      or data[12:16] not in (b'VP8 ',b'VP8L',b'VP8X')):
                      raise SystemExit('Invalid WebP '+p)
                  h=hashlib.sha256(data).hexdigest()
                  if h in digest: raise SystemExit('Repeated illustration '+p)
                  digest.add(h)
                  out=Path(p)
                  out.parent.mkdir(parents=True,exist_ok=True)
                  if out.exists(): raise SystemExit('Refusing to overwrite '+p)
                  out.write_bytes(data)
          game=Path('assets/lategame-noeffects-v117.js')
          content=game.read_text('utf-8')
          old='const ARTWORKS_COMPLETE=false;',new='const ARTWORKS_COMPLETE=true;'
          if content.count(old)!=1: raise SystemExit('Game activation gate was changed')
          content=content.replace(old,new)
          before='c.art=window.ArcaneArt?.makeArt?.(c)||makeArt(c);'
          if content.count(before)!=1: raise SystemExit('Image fallback insertion point changed')
          content=content.replace(before,'c.art=s.art;')
          game.write_text(content,encoding='utf-8')
          gallery=Path('assets/collection-v3-lategame-v117.js')
          content=gallery.read_text('utf-8')
          if content.count(old)!=1: raise SystemExit('Lexicon activation gate was changed')
          content=content.replace(old,new)
          before="kind:s.kind,\n   element:s.element,fusion:false,manifestOf:null,variantOf:null,art:''"
          after="kind:s.kind,\n   element:s.element,fusion:false,manifestOf:null,variantOf:null,art:s.art"
          if content.count(before)!=1: raise SystemExit('Lexicon image insertion point changed')
          content=content.replace(before,after)
          gallery.write_text(content,encoding='utf-8')
          page=Path('collection-v3.html')
          content=page.read_text('utf-8')
          if content.count('376')!=3: raise SystemExit('Unexpected hardcoded lexicon label count')
          page.write_text(content.replace('376','386'),encoding='utf-8')
          print('Imported and activated all ten distinct original WebPs and canonical cards.')
          PY
      - name: Audit functional role balance, stat budgets and previous game
        run: |
          node --check assets/lategame-noeffects-v117.js
          node --check assets/collection-v3-lategame-v117.js
          node --test tests/lategame-10-v117.test.cjs tests/lategame-monsters-v71.test.cjs tests/lategame-art-render-v71.test.cjs tests/lv1-saga-v43.test.cjs tests/collection-v3.test.cjs
      - name: Commit original artwork and live playable cards
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/custom-art/lategame-v117/ assets/lategame-noeffects-v117.js assets/collection-v3-lategame-v117.js collection-v3.html
          git rm -- assets/custom-art/Arcane-Duel-10-Monster-Artworks-ohne-Effekte-v117.zip
          git diff --cached --quiet && exit 0
          git commit -m "art(lategame): install and activate 10 original v11.7 monsters"
          git pull --rebase origin development
          git push origin HEAD:development
