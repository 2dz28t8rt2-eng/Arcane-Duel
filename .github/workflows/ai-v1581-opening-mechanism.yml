name: Arcane Duel - v15.81 First Six Turns Mechanism Isolation
on:
  push:
    branches: [development]
    paths: ['.github/workflows/ai-v1581-opening-mechanism.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  preflight:
    name: Verify unchanged engine and historical TRAIN-only AI inputs
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check simulator and original combat mechanics
        run: |
          set -euo pipefail
          node --check tests/ai-v1581-opening-mechanism.cjs
          node --check tests/ai-v1581-opening-mechanism-aggregate.cjs
          node --test tests/ai-v1575-counterplay.test.cjs tests/ai-v1574-stomp.test.cjs tests/fusion-stomp-v200.test.cjs tests/essence-combat.test.cjs tests/predator-pack-v198.test.cjs
          node tests/helpers/game-runtime.cjs
      - name: Reuse independently verified TRAIN-only research checkpoints
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/40513311546" --jq '.conclusion')" = success
          mkdir -p /tmp/arcane-v1581-priors artifacts/v1581-priors
          gh run download 40513311546 --repo "$GITHUB_REPOSITORY" --name arcane-v14972-counterplay --dir /tmp/arcane-v1581-priors
          for f in historical-train.json frozen-v1555-champion.json incumbent-policy.json older-q-checkpoint.json previous-training-q.json prior-selfplay-checkpoint.json provenance.json research-balanced-policy.json v1499-prior-q.json endgame-learner.json training-q-and-examples.json; do
            test -s "/tmp/arcane-v1581-priors/$f"
            cp "/tmp/arcane-v1581-priors/$f" "artifacts/v1581-priors/$f"
          done
          node - <<'JS'
          const a=require('node:assert/strict'),x=require('./artifacts/v1581-priors/endgame-learner.json');
          a.equal(x.sourceRun,40499008498);
          a.equal(x.split,'train');a.equal(x.holdoutUsed,false);a.equal(x.validationUsed,false);
          console.log('ARCANE_V1581_PRIORS_VERIFIED');
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: arcane-v1581-verified-priors
          path: artifacts/v1581-priors/
          retention-days: 90
  research:
    name: ${{ matrix.match }}-stage${{ matrix.stage }}-${{ matrix.factor }}
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        match: [mirror, cross]
        stage: [9, 10]
        factor: [baseline, equal-opening-attacks, no-creature-decay, no-attack-stat-loss, no-predator-swarm, no-predator-pierce]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: arcane-v1581-verified-priors
          path: artifacts/v1581/${{ matrix.match }}/${{ matrix.factor }}
      - name: Replay full same-seed 40-card duels with a single mechanism intervention
        env:
          ARCANE_V1580_MATCH: ${{ matrix.match }}
          ARCANE_V1581_FACTOR: ${{ matrix.factor }}
          ARCANE_STAGE: ${{ matrix.stage }}
        run: |
          set -euo pipefail
          for pair in 0 1 2 3 4 5 6 7; do
            for chunk in 0 1; do
              node --expose-gc --max-old-space-size=2400 tests/ai-v1581-opening-mechanism.cjs "$ARCANE_STAGE" "$pair" "$chunk"
            done
          done
      - name: Preserve diagnostic shards even if a match fails
        if: always()
        env:
          ARCANE_V1580_MATCH: ${{ matrix.match }}
          ARCANE_V1581_FACTOR: ${{ matrix.factor }}
          ARCANE_STAGE: ${{ matrix.stage }}
        run: |
          set -euo pipefail
          dir="${ARCANE_V1580_MATCH}/${ARCANE_V1581_FACTOR}"
          mkdir -p "artifacts/v1581-export/$dir"
          find "artifacts/v1581/$dir" -maxdepth 1 -name "stage-$ARCANE_STAGE-pair-*.json" -type f -exec cp {} "artifacts/v1581-export/$dir/" \;
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arcane-v1581-data-${{ matrix.match }}-${{ matrix.factor }}-stage${{ matrix.stage }}
          path: artifacts/v1581-export/
          retention-days: 90
          if-no-files-found: warn
  aggregate:
    name: Audit 9216 matched full games and identify causal early-turn mechanics
    needs: [preflight, research]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: arcane-v1581-data-*
          merge-multiple: true
          path: artifacts/v1581
      - name: Aggregate unbiased starter comparisons and six-turn telemetries
        run: node --max-old-space-size=3200 tests/ai-v1581-opening-mechanism-aggregate.cjs
      - name: Assert full-sample controls and sealed HOLDOUT
        run: |
          node - <<'JS'
          const a=require('node:assert/strict'),r=require('./artifacts/v1581/analysis/report.json');
          a.equal(r.totalDuels,9216);a.equal(r.status,'completed');
          a.equal(r.matchedMechanismPairs,7680);a.equal(r.starterPairs,4608);
          a.equal(r.labelChecks,2304);a.equal(r.controls.sameRNGStarterSwap,true);
          a.equal(r.controls.noSixthCard,true);a.equal(r.selection.anyGameplayChange,false);
          a.equal(r.selection.calculatedFrom,'TRAIN+VALIDATION only');
          console.log('ARCANE_V1581_MECHANISM_CONTROLS_COMPLETE');
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arcane-v1581-mechanics-9216-report
          path: artifacts/v1581/analysis/report.json
          retention-days: 90
          if-no-files-found: warn
