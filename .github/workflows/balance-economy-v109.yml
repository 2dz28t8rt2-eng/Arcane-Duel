name: Arcane Duel - Balance Economy v10.9
on:
  push:
    branches: [development]
    paths:
      - 'assets/game.js'
      - 'assets/expansion.js'
      - 'assets/balance-economy-v109.js'
      - 'index.html'
      - 'tests/balance-economy-v109.test.cjs'
      - '.github/workflows/balance-economy-v109.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  new-economy-and-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and exact mixed pack/currency tests
        run: |
          node --check assets/game.js
          node --check assets/expansion.js
          node --check assets/balance-economy-v109.js
          node --test tests/balance-economy-v109.test.cjs
      - name: Existing inventory/fusion/loot/save regression tests
        run: node --test tests/regression.test.cjs tests/shard-rework-v77.test.cjs tests/monster-roles-forge.test.cjs tests/ai-fusion-choice-v61.test.cjs
      - name: Smoke live game scripts and profile bootstrap
        run: node tests/helpers/game-runtime.cjs
