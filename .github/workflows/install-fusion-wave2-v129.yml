name: Install Arcane Duel Fusion Wave II Artworks
on:
  push:
    branches: [development]
    paths:
      - 'assets/custom-art/Arcane-Duel-10-neue-Fusionen-v129.zip'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: arcane-fusion-wave-v129
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
          persist-credentials: true
      - name: Verify and install exactly ten user-approved artworks
        run: |
          python3 - <<'PY'
          import hashlib,json,zipfile
          from pathlib import Path
          archive=Path('assets/custom-art/Arcane-Duel-10-neue-Fusionen-v129.zip')
          expected='d97af175c325135277b451d261b93f26bf82a762f0273c65a9113c6f99a2d56b'
          if not archive.is_file() or hashlib.sha256(archive.read_bytes()).hexdigest()!=expected:
              raise SystemExit('Missing or altered Fusion Wave v129 archive')
          specs=json.loads(Path('assets/fusion-wave2-v129-manifest.json').read_text('utf-8'))['cards']
          assert len(specs)==10 and [s['id'] for s in specs]==list(range(742,752))
          expected_paths={s['art'] for s in specs}
          assert len(expected_paths)==10
          with zipfile.ZipFile(archive) as z:
              actual_paths={x.filename for x in z.infolist() if not x.is_dir()}
              if actual_paths != expected_paths | {'manifest.json','INSTALLATION.md'}:
                  raise SystemExit('Unexpected/missing ZIP members')
              embedded=json.loads(z.read('manifest.json'))
              if [(x['id'],x['art'],x['name'],x['level']) for x in embedded['cards']] != [(x['id'],x['art'],x['name'],x['level']) for x in specs]:
                  raise SystemExit('Archive/card identity mismatch')
              hashes=set()
              for s in specs:
                  p=s['art']
                  if not p.startswith('assets/custom-art/fusion-wave2-v129/') or not p.endswith('.webp'):
                      raise SystemExit('Unsafe artwork path')
                  data=z.read(p)
                  if len(data)<70000 or data[0:4]!=b'RIFF' or data[8:12]!=b'WEBP' or data[12:16] not in (b'VP8 ',b'VP8L',b'VP8X'):
                      raise SystemExit('Not a valid WebP: '+p)
                  h=hashlib.sha256(data).hexdigest()
                  if h in hashes: raise SystemExit('Duplicate image')
                  hashes.add(h)
                  out=Path(p)
                  if out.exists(): raise SystemExit('Refusing to overwrite '+p)
                  out.parent.mkdir(parents=True,exist_ok=True)
                  out.write_bytes(data)
          for f in ['assets/fusion-wave2-v129.js','assets/collection-v3-fusion-wave2-v129.js']:
              p=Path(f);s=p.read_text('utf-8')
              if s.count('const ARTWORKS_COMPLETE=false;')!=1: raise SystemExit('Unexpected activation flag')
              p.write_text(s.replace('const ARTWORKS_COMPLETE=false;','const ARTWORKS_COMPLETE=true;'),encoding='utf-8')
          p=Path('collection-v3.html');s=p.read_text('utf-8')
          if s.count('386')!=3: raise SystemExit('Unexpected gallery base count')
          if s.count('fusion-v129-pending')!=1: raise SystemExit('Unexpected gallery cache key')
          p.write_text(s.replace('386','396').replace('fusion-v129-pending','fusion-v129-live'),encoding='utf-8')
          p=Path('index.html');s=p.read_text('utf-8')
          if s.count('fusion-v129-pending')!=1: raise SystemExit('Unexpected game cache key')
          p.write_text(s.replace('fusion-v129-pending','fusion-v129-live'),encoding='utf-8')
          print('Installed ten approved WebPs, card templates, and gallery entries.')
          PY
      - name: Verify JS and legacy gameplay
        run: |
          node --check assets/fusion-wave2-v129.js
          node --check assets/fusion-template-neutral-v129.js
          node --check assets/collection-v3-fusion-wave2-v129.js
          node --test tests/fusion-wave2-v129.test.cjs
      - name: Commit activated cards with their original artwork
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/custom-art/fusion-wave2-v129/ assets/fusion-wave2-v129.js assets/collection-v3-fusion-wave2-v129.js index.html collection-v3.html
          git rm -- assets/custom-art/Arcane-Duel-10-neue-Fusionen-v129.zip
          git diff --cached --quiet && exit 0
          git commit -m "art(fusions): activate ten original level 3-8 role-neutral fusion cards"
          git pull --rebase origin development
          git push origin HEAD:development
