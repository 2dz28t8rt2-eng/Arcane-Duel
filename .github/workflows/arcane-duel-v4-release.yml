name: Arcane Duel 4.0 – Bestiarium
on:
  push:
    branches: [development]
    paths:
      - assets/arcane-v4-catalog.json
      - assets/arcane-v4-live.js
      - assets/arcane-v4-credits.js
      - tools/finished-card-renderer.html
      - tools/arcane-v4-export.py
      - .github/workflows/arcane-duel-v4-release.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Install image tools
        run: python -m pip install --user pillow
      - name: Import genuine OpenGameArt illustrations
        run: python tools/arcane-v4-export.py import
      - name: Render 94 cards in seven level-ordered waves
        run: python tools/arcane-v4-export.py render
      - name: Publish generated images and source audit on development
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- assets/
          if git diff --cached --quiet; then
            echo "No generated asset changes"
          else
            git commit -m "art(4.0): publish generated monster cards and licensed OpenGameArt illustrations"
            for attempt in 1 2 3; do
              git pull --rebase origin development
              if git push origin HEAD:development; then exit 0; fi
              sleep 4
            done
            exit 1
          fi
      - name: Upload exported contact sheets
        uses: actions/upload-artifact@v4
        with:
          name: Arcane-Duel-4-0-Karten
          path: |
            assets/finished-cards/wave03/kontaktbogen-preview.webp
            assets/finished-cards/wave04/kontaktbogen-preview.webp
            assets/finished-cards/wave05/kontaktbogen-preview.webp
            assets/finished-cards/wave06/kontaktbogen-preview.webp
            assets/finished-cards/wave07/kontaktbogen-preview.webp
            assets/finished-cards/wave08/kontaktbogen-preview.webp
            assets/finished-cards/wave09/kontaktbogen-preview.webp
          if-no-files-found: warn
