name: Arcane artwork card metadata export
on:
  push:
    branches: [development]
    paths:
      - 'tests/browser-card-export-catalog.html'
      - '.github/workflows/card-export.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Export real card metadata from running game
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          python3 -m http.server 8757 --bind 127.0.0.1 >/tmp/arcane-export-server.log 2>&1 &
          trap 'kill $! || true' EXIT
          sleep 1
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --no-first-run --virtual-time-budget=12000 --window-size="1200,980" --dump-dom http://127.0.0.1:8757/tests/browser-card-export-catalog.html >/tmp/card-export.html 2>/tmp/card-export-chrome.log
          python3 - <<'PY'
          from html.parser import HTMLParser
          from html import unescape
          from pathlib import Path
          import json
          class P(HTMLParser):
              capturing=False
              content=''
              def handle_starttag(self,tag,attrs):
                  if tag=='pre' and ('id','exportStats') in attrs: self.capturing=True
              def handle_endtag(self,tag):
                  if tag=='pre': self.capturing=False
              def handle_data(self,text):
                  if self.capturing:self.content+=text
          p=P();p.feed(Path('/tmp/card-export.html').read_text())
          data=json.loads(unescape(p.content))
          print('ARCANE_CARD_EXPORT='+json.dumps(data,ensure_ascii=False,separators=(',',':')))
          assert data.get('status')=='ok' and len(data['cards'])==10
          PY
