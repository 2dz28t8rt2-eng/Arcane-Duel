name: Arcane Duel – Import 15 approved Artworks
on:
  push:
    branches: [development]
    paths:
      - 'artwork-import/arcane-approved-15.zip'
      - 'tests/approved-art-v56.test.cjs'
      - 'tools/import-approved-art-v56.py'
      - '.github/workflows/import-approved-art-v56.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install-user-approved-art:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install image verifier
        run: python -m pip install --quiet pillow
      - name: Verify all 15 assets and install exact Fate/fusion mappings
        run: python tools/import-approved-art-v56.py artwork-import/arcane-approved-15.zip
      - name: Run card identity and collection regressions
        run: |
          node --test tests/collection-v3.test.cjs tests/artwork-special-cases.test.cjs
          node --test tests/approved-art-v56.test.cjs
      - name: Commit verified art and gameplay mapping to development
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/custom-art/fate assets/custom-art/qa assets/collection-v3-data.js assets/fate-illustrations.js assets/approved-art-v56.js index.html
          if git diff --cached --quiet; then
            echo "All approved artworks are already installed."
          else
            git commit -m "art: install 15 approved originals, including the Himmlischer Löwenwächter"
            git pull --rebase origin development
            git push origin HEAD:development
          fi
