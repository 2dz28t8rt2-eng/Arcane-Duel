name: Repair Duo opponent snapshot
on:
  push:
    branches:
      - fix/ci-catalog-role-parity-20261030
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[sync-duo-opponents]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate opponent snapshots from live solo runtime
        run: |
          node scripts/build-duo-opponents-v201.cjs
          node scripts/build-duo-opponents-v201.cjs --check
      - name: Commit regenerated snapshots to repair branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/duo-opponent-catalog-v201.json supabase/functions/arcane-duo-v2/opponents.json
          if git diff --cached --quiet; then
            echo "No opponent drift remains"
            exit 0
          fi
          git commit -m "fix(duo): sync opponent snapshots with live solo encounter decks"
          git push origin "HEAD:${GITHUB_REF_NAME}"
