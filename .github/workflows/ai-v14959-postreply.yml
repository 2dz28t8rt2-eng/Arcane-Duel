name: Arcane Duel - v14.9.59 Post-Reply Defender Training
on:
  push:
    branches: [development]
    paths:
      - '.github/workflows/ai-v14959-postreply.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  postreply-research:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      SELFPLAY: tests/ai-v1559-postreply-selfplay.cjs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify new research scripts and real combat regression tests
        run: |
          set -euo pipefail
          for f in tests/ai-v1559-{history,Q,postreply-selfplay,postreply-aggregate}.cjs; do
            test -f "$f"
            node --check "$f"
          done
          node --test tests/predator-armor-live-v1499.test.cjs tests/predator-swarm-live-v1498.test.cjs tests/essence-combat.test.cjs tests/strategic-seat-parity-v1495.test.cjs
          # Check all constructed-deck seeds up front, including the new phase 7.
          # The deck builder rejects integers outside [0, 9999].
          node - <<'JS'
          const assert=require('node:assert/strict');
          for(let stage=0;stage<9;stage++){
            const scenarios=stage===4||stage===7?24:stage===8?12:6;
            for(let pair=0;pair<8;pair++)for(let scenario=0;scenario<scenarios;scenario++){
              const pairedStage=stage===6?5:stage;
              const seedA=5351+pair*157+scenario*79+pairedStage*241;
              const seedB=5609+pair*151+scenario*91+pairedStage*(stage===7?170:231);
              assert.ok(seedA>=0&&seedA<=9999&&seedB>=0&&seedB<=9999,
                'Invalid benchmark seed in '+JSON.stringify({stage,pair,scenario,seedA,seedB}));
            }
          }
          console.log('ARCANE_V1558_SEED_PREFLIGHT_PASS');
          JS
      - name: Restore successful v14.9.58 checkpoint and forty-seven-run TRAIN-only history
        env:
          GH_TOKEN: ${{ github.token }}
          ARCANE_PREVIOUS_ARTIFACT_DIR: /tmp/arcane-v1559-prior
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/40325243385" --jq '.conclusion')" = success
          mkdir -p /tmp/arcane-v1559-prior artifacts/v1559
          gh run download 40325243385 --repo "$GITHUB_REPOSITORY" --name arcane-v14958-ability-timing --dir /tmp/arcane-v1559-prior
          for f in older-q-checkpoint.json prior-selfplay-checkpoint.json incumbent-policy.json research-balanced-policy.json; do
            cp "/tmp/arcane-v1559-prior/$f" "artifacts/v1559/$f"
          done
          node tests/ai-v1559-history.cjs
      - name: Update Q values only with independent TRAIN-only confirmation
        run: node --expose-gc --max-old-space-size=3200 tests/ai-v1559-Q.cjs
      - name: Short preview smoke test for legal defender successor actions
        run: |
          set -euo pipefail
          node --expose-gc --max-old-space-size=2400 "$SELFPLAY" 8 0 0
          node - <<'JS'
          const assert=require('node:assert/strict');
          const f=require('./artifacts/v1559/stage-8-pair-0-chunk-0.json');
          assert.equal(f.cases.length,144);
          assert.ok(f.cases.some(x=>x.arm==='defender-postreply-followup'));
          assert.ok(f.cases.every(x=>x.illegalSwitchesBySeat.every(n=>n===0)));
          console.log('ARCANE_V1559_PREVIEW_SMOKE_OK');
          JS
      - name: Phase 0 - Level-8 mirrored decks and seats
        run: |
          set -euo pipefail
          for pair in 0 1 2 3 4 5 6 7; do node --expose-gc --max-old-space-size=1900 "$SELFPLAY" 0 "$pair"; done
          node "$SELFPLAY" 0 finalize
      - name: Phase 1 - Level-9 mirrored decks and seats
        run: |
          set -euo pipefail
          for pair in 0 1 2 3 4 5 6 7; do node --expose-gc --max-old-space-size=1900 "$SELFPLAY" 1 "$pair"; done
          node "$SELFPLAY" 1 finalize
      - name: Phase 2 - Level-10 cross-role transfer
        run: |
          set -euo pipefail
          for pair in 0 1 2 3 4 5 6 7; do node --expose-gc --max-old-space-size=1900 "$SELFPLAY" 2 "$pair"; done
          node "$SELFPLAY" 2 finalize
      - name: Phase 3 - Real symmetrical LP decay within main validation
        run: |
          set -euo pipefail
          for pair in 0 1 2 3 4 5 6 7; do node --expose-gc --max-old-space-size=1900 "$SELFPLAY" 3 "$pair"; done
          node "$SELFPLAY" 3 finalize
      - name: Phase 4 - Soul Guardian versus fusion predator controls (8 per split)
        run: |
          set -euo pipefail
          for pair in 0 1 2 3 4 5 6 7; do
            for chunk in 0 1 2 3; do node --expose-gc --max-old-space-size=2400 "$SELFPLAY" 4 "$pair" "$chunk"; done
          done
          node "$SELFPLAY" 4 finalize
      - name: Phase 5 - Exact-paired Level-10 baseline without decay
        run: |
          set -euo pipefail
          for pair in 0 1 2 3 4 5 6 7; do node --expose-gc --max-old-space-size=1900 "$SELFPLAY" 5 "$pair"; done
          node "$SELFPLAY" 5 finalize
      - name: Phase 6 - Exact-paired Level-10 counterpart with real decay
        run: |
          set -euo pipefail
          for pair in 0 1 2 3 4 5 6 7; do node --expose-gc --max-old-space-size=1900 "$SELFPLAY" 6 "$pair"; done
          node "$SELFPLAY" 6 finalize
      - name: Phase 7 - Four-chunk mirrored direct comparison with frozen v14.9.55 champion
        run: |
          set -euo pipefail
          for pair in 0 1 2 3 4 5 6 7; do
            for chunk in 0 1 2 3; do node --expose-gc --max-old-space-size=2400 "$SELFPLAY" 7 "$pair" "$chunk"; done
          done
          node "$SELFPLAY" 7 finalize
      - name: Phase 8 - Soul Guardian ability decisions and fusion protection (4 per split)
        run: |
          set -euo pipefail
          for pair in 0 1 2 3 4 5 6 7; do
            for chunk in 0 1; do node --expose-gc --max-old-space-size=2400 "$SELFPLAY" 8 "$pair" "$chunk"; done
          done
          node "$SELFPLAY" 8 finalize
      - name: Aggregate post-reply legal Soul followups and condense decisions
        run: node --max-old-space-size=3200 tests/ai-v1559-postreply-aggregate.cjs
      - name: Validate complete 18432-duel report and sealed holdout
        run: |
          set -euo pipefail
          node - <<'JS'
          const a=require('node:assert/strict'),fs=require('node:fs'),p='artifacts/v1559/';
          const read=f=>JSON.parse(fs.readFileSync(p+f,'utf8'));
          const r=read('report.json'),h=read('historical-train.json');
          const q=read('training-q-and-examples.json'),prov=read('provenance.json');
          const frozen=read('frozen-v1555-champion.json');
          a.equal(r.status,'completed');a.equal(r.totalDuels,18432);
          a.equal(r.primaryDuels,9216);a.equal(r.stages.length,9);a.equal(r.arms.length,6);
          a.equal(h.sources.length,48);a.equal(h.examples.length,6342);
          a.equal(h.sources.at(-1),40325243385);
          a.equal(prov.holdoutAsTraining,false);a.equal(q.length,3);
          a.equal(frozen.arm,'l10-guarded-worst-reply');a.equal(frozen.holdoutUsed,false);
          a.ok(r.controls.holdoutNeverUsedForSelection);
          a.ok(r.controls.directH2HTrainValidationRequiredForPromotion);
          a.ok(r.controls.focusedL10HoldoutExcludedFromSelection);
          a.ok(r.controls.trainOnlyPairedFirstActionDivergence);
          a.ok(r.controls.noProductionChanges);
          a.equal(r.decisionDiagnostics.length,3);
          a.ok(r.decisionDiagnostics.every(x=>x.trainCases===1024));
          a.deepEqual(r.globalSelection.selectionGateStages,[0,1,2,3,4,7,8]);
          a.equal(r.globalSelection.holdoutSeenBySelector,false);
          for(let stage=0;stage<9;stage++){
            const s=read('stage-'+stage+'.json');
            a.equal(s.allCases.length,stage===4?4608:stage===7?4608:stage===8?2304:1152);
            a.equal(s.summaries.length,6);a.equal(s.promoted,false);
            a.ok(s.allCases.every(x=>x.illegalSwitchesBySeat.every(n=>n===0)));
            a.ok(s.allCases.every(x=>x.selfPlayStrategicBySeat.every(n=>n>0)));
            a.ok(s.allCases.every(x=>x.decayEnabled===(stage===3||stage===6)));
            if(stage===7)a.ok(s.allCases.every(x=>x.foeCheckpoint==='guarded-v1555'));
            const d=read('stage-'+stage+'-decision-diffs.json');
            a.equal(d.rows.length,stage===4?768:stage===7?768:stage===8?384:192);
            a.ok(d.rows.every(x=>x.split==='train'));
          }
          const winner=r.globalSelection;
          if(winner.promoted){
            const z=winner.candidates.find(x=>x.arm===winner.arm);
            a.ok(z?.qualifies&&z.guardianGate&&z.seatNonRegressionVsFrozen);
            a.ok(z.validationGainVsFrozen>=6&&z.trainGainVsFrozen>=2);
            a.ok(z.hardL10ValidationVsFrozen>=2&&z.hardL10ValidationVsGuardian>=2);
            a.ok(z.decayValidationVsFrozen>=0);
            a.ok(z.h2hTrainGain>=4&&z.h2hValidationGain>=8);
            a.ok(z.focusedValidationGain>=0);
            a.ok(z.fusionNonRegression&&z.fusionValidationGain>=0&&z.fusionTrainGain>=0);
            a.ok(z.predatorValidationGain>=-1);
          }else a.equal(winner.arm,'l10-guarded-worst-reply');
          a.ok(r.controls.damageAwareDefenderActions);
          a.ok(r.controls.defenderRoleScopedPlanner);
          a.ok(r.controls.fusionNonRegressionGate);
          a.ok(r.controls.nonDefenderExactReplayParity);
          a.ok(r.arms.some(x=>x.arm==='defender-v1558-future-control'&&
            x.evaluations.defenderAbilityChecks>0&&x.evaluations.defenderScopedSkipped>0));
          a.ok(r.arms.some(x=>x.arm==='defender-postreply-followup'&&
            x.evaluations.defenderCriticalReplyChecks>0&&
            x.evaluations.defenderPostReplyForecasts>0&&x.evaluations.defenderPostReplyLegal>0));
          a.ok(r.arms.some(x=>x.arm==='defender-followup-condense'&&
            x.evaluations.defenderCondenseOffered>0&&x.evaluations.defenderCondenseApplied>0&&
            x.evaluations.defenderPostReplyForecasts>0));
          console.log('ARCANE_V1559_VALIDATED '+JSON.stringify({
            duels:r.totalDuels,champion:winner.arm,promoted:winner.promoted,
            qualified:winner.candidates.filter(x=>x.qualifies).map(x=>x.arm)
          }));
          JS
      - name: Archive all sealed research phases and historical checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arcane-v14959-postreply
          path: artifacts/v1559/
          retention-days: 90
          if-no-files-found: warn
