name: Arcane Duel - v15.93 First-Monster Protection, Initiative & Fusion Recovery
on:
  push:
    branches: [development]
    paths:
      - '.github/workflows/ai-v1593-first-monster-protection.yml'
      - 'tests/ai-v1593-first-monster-protection.cjs'
      - 'tests/ai-v1593-first-monster-protection-aggregate.cjs'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  preflight:
    name: Verify first-monster protection and no live rules promotion
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check scripts and five combat regressions
        run: |
          set -euo pipefail
          node --check tests/ai-v1593-first-monster-protection.cjs
          node --check tests/ai-v1593-first-monster-protection-aggregate.cjs
          node --check tests/ai-v1584-initiative-windows.cjs
          node --test tests/opening-shield-removal-v1592.test.cjs
          node --test tests/ai-v1575-counterplay.test.cjs tests/ai-v1574-stomp.test.cjs tests/fusion-stomp-v200.test.cjs tests/essence-combat.test.cjs tests/predator-pack-v198.test.cjs
          node tests/helpers/game-runtime.cjs
      - name: Verify completed v15.92 and sealed TRAIN-only historical priors
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/40825958078" --jq '.conclusion')" = success
          mkdir -p /tmp/arcane-v1593-priors artifacts/v1593-priors
          gh run download 40513311546 --repo "$GITHUB_REPOSITORY" --name arcane-v14972-counterplay --dir /tmp/arcane-v1593-priors
          for f in historical-train.json frozen-v1555-champion.json incumbent-policy.json older-q-checkpoint.json previous-training-q.json prior-selfplay-checkpoint.json provenance.json research-balanced-policy.json v1499-prior-q.json endgame-learner.json training-q-and-examples.json; do
            test -s "/tmp/arcane-v1593-priors/$f"
            cp "/tmp/arcane-v1593-priors/$f" "artifacts/v1593-priors/$f"
          done
          node - <<'JS'
          const assert=require('node:assert/strict');
          const x=require('./artifacts/v1593-priors/endgame-learner.json');
          assert.equal(x.sourceRun,40499008498);
          assert.equal(x.split,'train');
          assert.equal(x.holdoutUsed,false);
          assert.equal(x.validationUsed,false);
          console.log('ARCANE_V1593_SEALED_PRIORS_VERIFIED');
          JS
      - name: Smoke-test first-monster protection and real Fusion actions
        run: |
          set -euo pipefail
          for mode in baseline once turn2 normalOnly onceNormal; do
            dir="artifacts/v1593/r0/mirror/$mode"
            mkdir -p "$dir"
            cp artifacts/v1593-priors/*.json "$dir/"
            ARCANE_V1580_MATCH=mirror ARCANE_V1593_MODE="$mode" ARCANE_V1593_REPLICATE=0 \
              node --expose-gc --max-old-space-size=2400 tests/ai-v1593-first-monster-protection.cjs 10 0 0
          done
          node - <<'JS'
          const assert=require('node:assert/strict');
          for(const mode of ['baseline','once','turn2','normalOnly','onceNormal']){
            const data=require('./artifacts/v1593/r0/mirror/'+mode+'/stage-10-pair-0-chunk-0.json');
            assert.equal(data.cases.length,24);
            let realFusions=0;
            for(const c of data.cases){
              assert.equal(c.predatorEvolutionMode1593,mode);
              assert.ok(c.openingRuleFlags.predatorSwarm>0);
              assert.ok(c.openingRuleFlags.predatorPierce>0);
              assert.ok(Array.isArray(c.actualFusionActionsBySeat1593));
              assert.ok(Array.isArray(c.actualFusionsUnderPredatorPressureBySeat1593));
              realFusions+=c.actualFusionActionsBySeat1593[0]+c.actualFusionActionsBySeat1593[1];
              assert.ok(c.firstAttack1585===null||c.firstAttack1585.turn>=2);
              assert.equal(c.predatorEvolutionAssignments1593,0);
              assert.deepEqual(c.openingBeginning.map(p=>p.shield),[0,0]);
              assert.ok(c.openingFieldByTurn1593&&Object.keys(c.openingFieldByTurn1593).length>0);
              assert.ok(Number.isInteger(c.protectedOpeningCard1593));
              assert.ok(Array.isArray(c.openingGuardEvents1593));
              assert.equal(c.openingGuardEvents1593.length,c.openingProtectionHits1593);
              assert.equal(c.openingSavedFusion1593+c.openingSavedNormal1593,c.openingPreventedKills1593);
              if(mode==='baseline')assert.equal(c.openingProtectionHits1593,0);
              if(['normalOnly','onceNormal'].includes(mode))assert.equal(c.openingSavedFusion1593,0);
              if(['once','onceNormal'].includes(mode))assert.ok(c.openingProtectionHits1593<=1);
            }
            assert.ok(realFusions>0,'Fusion action telemetry silent in '+mode);
          }
          console.log('ARCANE_V1593_PROTECTION_AND_REAL_FUSION_PREFLIGHT');
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: arcane-v1593-verified-priors
          path: artifacts/v1593-priors/
          retention-days: 90
  research:
    name: ${{ matrix.match }}-stage${{ matrix.stage }}-${{ matrix.mode }}-r${{ matrix.replicate }}
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        match: [mirror, cross]
        stage: [9, 10]
        mode: [baseline, once, turn2, normalOnly, onceNormal]
        replicate: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: arcane-v1593-verified-priors
          path: artifacts/v1593/r${{ matrix.replicate }}/${{ matrix.match }}/${{ matrix.mode }}
      - name: Compare one-hit and full-turn starter creature protection, including Fusion exclusion
        env:
          ARCANE_V1580_MATCH: ${{ matrix.match }}
          ARCANE_V1593_MODE: ${{ matrix.mode }}
          ARCANE_V1593_REPLICATE: ${{ matrix.replicate }}
          ARCANE_STAGE: ${{ matrix.stage }}
        run: |
          set -euo pipefail
          for pair in 0 1 2 3 4 5 6 7; do
            for chunk in 0 1; do
              node --expose-gc --max-old-space-size=2400 tests/ai-v1593-first-monster-protection.cjs "$ARCANE_STAGE" "$pair" "$chunk"
            done
          done
      - name: Preserve partial research data even on failure
        if: always()
        env:
          ARCANE_V1580_MATCH: ${{ matrix.match }}
          ARCANE_V1593_MODE: ${{ matrix.mode }}
          ARCANE_V1593_REPLICATE: ${{ matrix.replicate }}
          ARCANE_STAGE: ${{ matrix.stage }}
        run: |
          set -euo pipefail
          dir="r${ARCANE_V1593_REPLICATE}/${ARCANE_V1580_MATCH}/${ARCANE_V1593_MODE}"
          mkdir -p "artifacts/v1593-export/$dir"
          find "artifacts/v1593/$dir" -maxdepth 1 -name "stage-$ARCANE_STAGE-pair-*.json" -type f -exec cp {} "artifacts/v1593-export/$dir/" \;
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arcane-v1593-data-${{ matrix.match }}-${{ matrix.mode }}-stage${{ matrix.stage }}-r${{ matrix.replicate }}
          path: artifacts/v1593-export/
          retention-days: 90
          if-no-files-found: warn
  aggregate:
    name: Audit protected opening creature survival, initiative and Fusion counterplay
    needs: [preflight, research]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: arcane-v1593-data-*
          merge-multiple: true
          path: artifacts/v1593
      - name: Run paired first-monster protection and field-recovery audit
        run: node --max-old-space-size=3200 tests/ai-v1593-first-monster-protection-aggregate.cjs
      - name: Require paired validity, removed opening shield, real Fusion evidence and sealed holdout
        run: |
          node - <<'JS'
          const assert=require('node:assert/strict');
          const r=require('./artifacts/v1593/analysis/report.json');
          assert.equal(r.status,'completed');
          assert.equal(r.totalDuels,23040);
          assert.equal(r.independentDuels,17280);
          assert.equal(r.starterPairs,11520);
          assert.equal(r.labelChecks,5760);
          assert.equal(r.matchedMechanismPairs,18432);
          assert.deepEqual(r.modes,['baseline','once','turn2','normalOnly','onceNormal']);
          assert.deepEqual(r.replicates,[0,1,2]);
          assert.equal(r.controls.onlyOpeningShieldChangedInLiveGame,true);
          assert.equal(r.controls.unchangedSwarm,true);
          assert.equal(r.controls.unchangedArmorPierce,true);
          assert.equal(r.controls.unalteredPredatorDEF,true);
          assert.equal(r.controls.initialShieldRemovedInLiveGame,true);
          assert.equal(r.controls.allPredatorStatsUnchanged,true);
          assert.equal(r.controls.noAutomaticPromotion,true);
          assert.equal(r.controls.holdoutSelectionUsed,false);
          for(const mode of r.modes)
            assert.ok(r.byMatchStage['mirror-10'][mode].fusion.verifiedRealFusionActions>0);
          console.log('ARCANE_V1593_OPENING_PROTECTION_AUDIT_VERIFIED');
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arcane-v1593-first-monster-protection-23040-report
          path: artifacts/v1593/analysis/report.json
          retention-days: 90
          if-no-files-found: warn
