name: Arcane Duel – Earned Deck Confirmation v6.3
on:
  push:
    branches: [development]
    paths:
      - 'tests/ai-earned-confirmation-v63.cjs'
      - '.github/workflows/ai-earned-confirmation-v63.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  confirm-fixed-stage-two-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Replay exact earned careers without gifting progress
        env:
          ARCANE_CAREER_RUNS: '6'
          ARCANE_CAREER_TIER_ATTEMPTS: '12'
        run: node tests/ai-real-career-snapshots-v63.cjs
      - name: Confirm frozen opponent-II profile on third independent seed range
        env:
          ARCANE_CAREER_CONFIRM_SEEDS: '12'
        run: |
          node --check tests/ai-earned-confirmation-v63.cjs
          node tests/ai-earned-confirmation-v63.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arcane-real-career-confirmation-v63
          path: |
            artifacts/ai-real-careers-v63.json
            artifacts/ai-earned-confirmation-v63.json
          if-no-files-found: warn
          retention-days: 30
