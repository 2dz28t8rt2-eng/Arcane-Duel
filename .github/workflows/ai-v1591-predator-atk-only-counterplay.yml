name: Arcane Duel - v15.91 Starter Advantage Causality & Fusion Counterplay
on:
  push:
    branches: [development]
    paths:
      - '.github/workflows/ai-v1591-predator-atk-only-counterplay.yml'
      - 'tests/ai-v1591-predator-atk-only-counterplay.cjs'
      - 'tests/ai-v1591-predator-atk-only-counterplay-aggregate.cjs'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  preflight:
    name: Verify starter-shield and first-attack controls, full DEF and Swarm
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check scripts and five combat regressions
        run: |
          set -euo pipefail
          node --check tests/ai-v1591-predator-atk-only-counterplay.cjs
          node --check tests/ai-v1591-predator-atk-only-counterplay-aggregate.cjs
          node --check tests/ai-v1584-initiative-windows.cjs
          node --test tests/ai-v1575-counterplay.test.cjs tests/ai-v1574-stomp.test.cjs tests/fusion-stomp-v200.test.cjs tests/essence-combat.test.cjs tests/predator-pack-v198.test.cjs
          node tests/helpers/game-runtime.cjs
      - name: Verify completed v15.90 and sealed TRAIN-only historical priors
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/40775688968" --jq '.conclusion')" = success
          mkdir -p /tmp/arcane-v1591-priors artifacts/v1591-priors
          gh run download 40513311546 --repo "$GITHUB_REPOSITORY" --name arcane-v14972-counterplay --dir /tmp/arcane-v1591-priors
          for f in historical-train.json frozen-v1555-champion.json incumbent-policy.json older-q-checkpoint.json previous-training-q.json prior-selfplay-checkpoint.json provenance.json research-balanced-policy.json v1499-prior-q.json endgame-learner.json training-q-and-examples.json; do
            test -s "/tmp/arcane-v1591-priors/$f"
            cp "/tmp/arcane-v1591-priors/$f" "artifacts/v1591-priors/$f"
          done
          node - <<'JS'
          const assert=require('node:assert/strict');
          const x=require('./artifacts/v1591-priors/endgame-learner.json');
          assert.equal(x.sourceRun,40499008498);
          assert.equal(x.split,'train');
          assert.equal(x.holdoutUsed,false);
          assert.equal(x.validationUsed,false);
          console.log('ARCANE_V1591_SEALED_PRIORS_VERIFIED');
          JS
      - name: Smoke-test four matched starter interventions and real Fusion actions
        run: |
          set -euo pipefail
          for mode in baseline atk85 noShield ready2 noShieldReady2; do
            dir="artifacts/v1591/r0/mirror/$mode"
            mkdir -p "$dir"
            cp artifacts/v1591-priors/*.json "$dir/"
            ARCANE_V1580_MATCH=mirror ARCANE_V1591_MODE="$mode" ARCANE_V1591_REPLICATE=0 \
              node --expose-gc --max-old-space-size=2400 tests/ai-v1591-predator-atk-only-counterplay.cjs 10 0 0
          done
          node - <<'JS'
          const assert=require('node:assert/strict');
          for(const mode of ['baseline','atk85','noShield','ready2','noShieldReady2']){
            const data=require('./artifacts/v1591/r0/mirror/'+mode+'/stage-10-pair-0-chunk-0.json');
            assert.equal(data.cases.length,24);
            let realFusions=0;
            for(const c of data.cases){
              assert.equal(c.predatorEvolutionMode1591,mode);
              assert.ok(c.openingRuleFlags.predatorSwarm>0);
              assert.ok(c.openingRuleFlags.predatorPierce>0);
              assert.ok(Array.isArray(c.actualFusionActionsBySeat1591));
              assert.ok(Array.isArray(c.actualFusionsUnderPredatorPressureBySeat1591));
              realFusions+=c.actualFusionActionsBySeat1591[0]+c.actualFusionActionsBySeat1591[1];
              assert.ok(c.firstAttack1585===null||c.firstAttack1585.turn>=2);
              if(mode==='atk85')assert.ok(c.predatorEvolutionAssignments1591>=0);
              else assert.equal(c.predatorEvolutionAssignments1591,0);
              if(['noShield','noShieldReady2'].includes(mode))
                assert.equal(c.openingBeginning[1-c.starter].shield,0);
              if(['ready2','noShieldReady2'].includes(mode)){
                assert.equal(c.openingActionByTurn?.[2]?.types?.attack||0,0);
                if(c.firstAttack1585)assert.ok(c.firstAttack1585.turn>=3);
              }
            }
            assert.ok(realFusions>0,'Fusion action telemetry silent in '+mode);
          }
          console.log('ARCANE_V1591_CAUSAL_AND_REAL_FUSION_PREFLIGHT');
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: arcane-v1591-verified-priors
          path: artifacts/v1591-priors/
          retention-days: 90
  research:
    name: ${{ matrix.match }}-stage${{ matrix.stage }}-${{ matrix.mode }}-r${{ matrix.replicate }}
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        match: [mirror, cross]
        stage: [9, 10]
        mode: [baseline, atk85, noShield, ready2, noShieldReady2]
        replicate: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: arcane-v1591-verified-priors
          path: artifacts/v1591/r${{ matrix.replicate }}/${{ matrix.match }}/${{ matrix.mode }}
      - name: Isolate turn-two attack opportunity and second-player shield while preserving Swarm
        env:
          ARCANE_V1580_MATCH: ${{ matrix.match }}
          ARCANE_V1591_MODE: ${{ matrix.mode }}
          ARCANE_V1591_REPLICATE: ${{ matrix.replicate }}
          ARCANE_STAGE: ${{ matrix.stage }}
        run: |
          set -euo pipefail
          for pair in 0 1 2 3 4 5 6 7; do
            for chunk in 0 1; do
              node --expose-gc --max-old-space-size=2400 tests/ai-v1591-predator-atk-only-counterplay.cjs "$ARCANE_STAGE" "$pair" "$chunk"
            done
          done
      - name: Preserve partial research data even on failure
        if: always()
        env:
          ARCANE_V1580_MATCH: ${{ matrix.match }}
          ARCANE_V1591_MODE: ${{ matrix.mode }}
          ARCANE_V1591_REPLICATE: ${{ matrix.replicate }}
          ARCANE_STAGE: ${{ matrix.stage }}
        run: |
          set -euo pipefail
          dir="r${ARCANE_V1591_REPLICATE}/${ARCANE_V1580_MATCH}/${ARCANE_V1591_MODE}"
          mkdir -p "artifacts/v1591-export/$dir"
          find "artifacts/v1591/$dir" -maxdepth 1 -name "stage-$ARCANE_STAGE-pair-*.json" -type f -exec cp {} "artifacts/v1591-export/$dir/" \;
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arcane-v1591-data-${{ matrix.match }}-${{ matrix.mode }}-stage${{ matrix.stage }}-r${{ matrix.replicate }}
          path: artifacts/v1591-export/
          retention-days: 90
          if-no-files-found: warn
  aggregate:
    name: Audit starter advantage, attack causality, legal Fusion responses and full DEF
    needs: [preflight, research]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: arcane-v1591-data-*
          merge-multiple: true
          path: artifacts/v1591
      - name: Run matched game-mechanism audit, first attacks, real Fusion responses
        run: node --max-old-space-size=3200 tests/ai-v1591-predator-atk-only-counterplay-aggregate.cjs
      - name: Require paired validity, no live changes, real Fusion evidence and sealed holdout
        run: |
          node - <<'JS'
          const assert=require('node:assert/strict');
          const r=require('./artifacts/v1591/analysis/report.json');
          assert.equal(r.status,'completed');
          assert.equal(r.totalDuels,23040);
          assert.equal(r.independentDuels,17280);
          assert.equal(r.starterPairs,11520);
          assert.equal(r.labelChecks,5760);
          assert.equal(r.matchedMechanismPairs,18432);
          assert.deepEqual(r.modes,['baseline','atk85','noShield','ready2','noShieldReady2']);
          assert.deepEqual(r.replicates,[0,1,2]);
          assert.equal(r.controls.gameplayUntouched,true);
          assert.equal(r.controls.unchangedSwarm,true);
          assert.equal(r.controls.unchangedArmorPierce,true);
          assert.equal(r.controls.unalteredPredatorDEF,true);
          assert.equal(r.controls.atk85NormalNonFusionPredatorsOnly,true);
          assert.equal(r.controls.noAutomaticPromotion,true);
          assert.equal(r.controls.holdoutSelectionUsed,false);
          for(const mode of r.modes)
            assert.ok(r.byMatchStage['mirror-10'][mode].fusion.verifiedRealFusionActions>0);
          console.log('ARCANE_V1591_STARTER_CAUSALITY_FUSION_AUDIT_VERIFIED');
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arcane-v1591-starter-causality-fusion-counterplay-23040-report
          path: artifacts/v1591/analysis/report.json
          retention-days: 90
          if-no-files-found: warn
