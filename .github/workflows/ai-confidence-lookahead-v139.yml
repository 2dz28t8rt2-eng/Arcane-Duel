name: Arcane Duel - v13.9 Confidence-Gated Learning and Two-Action Planning
on:
  push:
    branches: [development]
    paths:
      - 'tests/ai-confidence-lookahead-v139.cjs'
      - '.github/workflows/ai-confidence-lookahead-v139.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: arcane-v139-curriculum-${{ github.ref }}
  cancel-in-progress: false
jobs:
  mechanism-curriculum-and-memory:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify legacy rules and new replay trainer
        run: |
          node --check tests/ai-confidence-lookahead-v139.cjs
          node --test tests/ai-history-v130.test.cjs tests/ai-board-planner-v129.test.cjs
      - name: Restore three generations of authentic historical match statistics
        uses: actions/download-artifact@v4
        with:
          name: arcane-v136-extensive-1200-episode-selfplay
          repository: 2dz28t8rt2-eng/Arcane-Duel
          run-id: 39637833422
          github-token: ${{ github.token }}
          path: artifacts/history
      - name: Restore v13.7 archived decision alternatives
        uses: actions/download-artifact@v4
        with:
          name: arcane-v137-history-curriculum-league-counterfactual-report
          repository: 2dz28t8rt2-eng/Arcane-Duel
          run-id: 39641190561
          github-token: ${{ github.token }}
          path: artifacts/v137history
      - name: Restore v13.8 failed candidate decision traces as historical lessons
        uses: actions/download-artifact@v4
        with:
          name: arcane-v138-rule-decision-memory-and-trained-candidate
          repository: 2dz28t8rt2-eng/Arcane-Duel
          run-id: 39642462976
          github-token: ${{ github.token }}
          path: artifacts/history-v138
      - name: Verify lineage, three reports and replay gap
        run: |
          test "$(find artifacts/history -name 'ai-v136-training-report.json' | wc -l)" -eq 3
          V137=$(find artifacts/v137history -name history-and-counterfactual.json -type f | head -1)
          test -n "$V137"
          if [ "$V137" != "artifacts/v137history/history-and-counterfactual.json" ]; then cp "$V137" artifacts/v137history/history-and-counterfactual.json; fi
          node - <<'JS'
          const fs=require('fs'),assert=require('node:assert/strict');
          const m=JSON.parse(fs.readFileSync('models/ai-selfplay-v136.json','utf8'));
          const h=JSON.parse(fs.readFileSync('artifacts/v137history/history-and-counterfactual.json','utf8'));
          assert.equal(m.gamesTrained,1920);
          assert.equal(h.schema,'arcane-v137-history-and-counterfactual');
          assert.ok(h.curriculum.realActionPairing.pairedCounterfactualStates>=18);
          console.log('Arcane v13.9 restored:',m.gamesTrained,'old training duels and',h.curriculum.realActionPairing.pairedCounterfactualStates,'old controlled choice pairs');
          JS
      - name: Validate paired action legality, recording and comparison on pilot
        env:
          ARCANE_V139_CASES: '8'
          ARCANE_V139_HOLDOUT: '6'
          ARCANE_V139_LEAGUE: '3'
        run: node tests/ai-confidence-lookahead-v139.cjs
      - name: Run v13.9 confidence-gated learning and two-action planner independent league
        env:
          ARCANE_V139_CASES: '84'
          ARCANE_V139_HOLDOUT: '30'
          ARCANE_V139_LEAGUE: '12'
        run: node tests/ai-confidence-lookahead-v139.cjs
      - name: Save new decision replay, mechanic audit, standalone candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arcane-v139-confidence-lookahead-league-report
          path: |
            artifacts/v139/decision-replay.json
            artifacts/v139/curriculum-report.json
            artifacts/v139/candidate-model.json
          retention-days: 90
          if-no-files-found: warn
