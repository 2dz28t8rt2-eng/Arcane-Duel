name: Arcane Duel - v14.9.15 Cross-Deck 80-20 Protected Q and Counter-Rollouts (verified attackPlan contract)
on:
  push:
    branches: [development]
    paths:
      - '.github/workflows/ai-v14915-crossdeck-rollout.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  train-crossdeck-history:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source syntax and combat parity regressions
        run: |
          set -euo pipefail
          node --check tests/ai-v1515-history.cjs
          node --check tests/ai-v1515-Q.cjs
          node --check tests/ai-v1515-crossdeck-shards.cjs
          node --check tests/ai-v1515-aggregate.cjs
          node --test tests/predator-armor-live-v1499.test.cjs tests/predator-swarm-live-v1498.test.cjs tests/essence-combat.test.cjs tests/strategic-seat-parity-v1495.test.cjs
      - name: Recover verified old train-only replay and latest successful Q checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/arcane-prev /tmp/arcane-history/{v1511,v1512,v1513,v1514} artifacts/v1515
          for rid in 39803691439 39843438099 39847734409 39851537706; do
            status=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$rid" --jq '.conclusion')
            test "$status" = success
          done
          gh run download 39803691439 --repo "$GITHUB_REPOSITORY" --name arcane-v14911-summon-fusion-training --dir /tmp/arcane-history/v1511
          gh run download 39843438099 --repo "$GITHUB_REPOSITORY" --name arcane-v14912-veteran-predator-training --dir /tmp/arcane-history/v1512
          gh run download 39847734409 --repo "$GITHUB_REPOSITORY" --name arcane-v14913-symmetric-history --dir /tmp/arcane-history/v1513
          gh run download 39851537706 --repo "$GITHUB_REPOSITORY" --name arcane-v14914-crossdeck-history --dir /tmp/arcane-history/v1514
          LAST=$(gh run list --workflow ai-v14915-crossdeck-rollout.yml --branch development --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty' || true)
          if [ -n "$LAST" ]; then
            gh run download "$LAST" --repo "$GITHUB_REPOSITORY" --name arcane-v14915-crossdeck-rollout --dir /tmp/arcane-prev
            echo "ARCANE_V1515_RESTORED $LAST"
          else
            cp /tmp/arcane-history/v1514/training-q-and-examples.json /tmp/arcane-prev/training-q-and-examples.json
            echo "ARCANE_V1515_RESTORED 39851537706"
          fi
          node tests/ai-v1515-history.cjs
          node - <<'JS'
          const fs=require('node:fs'),a=require('node:assert/strict');
          const t=JSON.parse(fs.readFileSync('/tmp/arcane-history/v1514/training-action-trajectories.json','utf8'));
          a.ok(Array.isArray(t.examples)&&t.examples.length>=1900,'Missing previous legal research trajectories');
          const byRole={};let total=0;
          for(const example of t.examples){
            a.ok(example.matchKey&&example.candidateRole&&example.opponentRole&&Array.isArray(example.trajectory));
            total+=example.trajectory.length;
            const key=example.candidateRole+' vs '+example.opponentRole;
            const p=byRole[key]||(byRole[key]={duels:0,losses:0,actions:0});
            p.duels++;p.losses+=Number(example.won===0);p.actions+=example.trajectory.length;
          }
          const summary={sourceRun:39851537706,trainingOnly:true,duels:t.examples.length,
           actions:total,hardest:[...Object.entries(byRole)].sort((a,b)=>b[1].losses/Math.max(1,b[1].duels)-a[1].losses/Math.max(1,a[1].duels)).slice(0,12)};
          fs.writeFileSync('artifacts/v1515/previous-trajectory-analysis.json',JSON.stringify(summary,null,2)+'\n');
          console.log('ARCANE_V1515_PREVIOUS_TRAJECTORIES '+JSON.stringify({duels:summary.duels,actions:summary.actions,hardest:summary.hardest.slice(0,3)}));
          JS
      - name: Continue protected historical Q with two internal validation sets
        run: node --expose-gc --max-old-space-size=3200 tests/ai-v1515-Q.cjs
      - name: Cross-Deck smoke – both different and mirrored 40-card decks
        run: |
          set -euo pipefail
          node --expose-gc --max-old-space-size=1800 tests/ai-v1515-crossdeck-shards.cjs 0
          node --expose-gc --max-old-space-size=1800 tests/ai-v1515-crossdeck-shards.cjs 32
          node - <<'JS'
          const fs=require('node:fs'),a=require('node:assert/strict');
          const rows=[0,32].flatMap(i=>JSON.parse(fs.readFileSync(
            'artifacts/v1515/shards/part-'+String(i).padStart(2,'0')+'.json','utf8')).cases);
          const deep=rows.filter(r=>r.arm==='Q-two-counter-planner');
          const shallow=rows.filter(r=>r.arm==='Q-one-counter-planner');
          const totals=arr=>arr.reduce((o,r)=>({
            seen:o.seen+r.secondCounterOpportunities+r.attackSecondOpportunities,
            done:o.done+r.doubleCounters+r.attackSecondCounters}),{seen:0,done:0});
          const d=totals(deep),s=totals(shallow);
          a.ok(d.seen>0,'Smoke has no eligible second attack');
          a.ok(d.done>0,'Broken attackPlan response contract: no legal second attack executed');
          a.equal(s.done,0,'Single-counter arm unexpectedly uses second reply');
          console.log('ARCANE_V1515_COUNTER_SMOKE '+JSON.stringify({deep:d,shallow:s}));
          JS
      - name: Run remaining 38 counter-rollout and cross-deck shards
        run: |
          set -euo pipefail
          for shard in $(seq 1 39); do
            if [ "$shard" = "32" ]; then continue; fi
            echo "::group::cross-deck / mirror shard $shard"
            node --expose-gc --max-old-space-size=1800 tests/ai-v1515-crossdeck-shards.cjs "$shard"
            echo "::endgroup::"
          done
      - name: Validate exact 80-20 ratios and archive train-only action histories
        run: node --max-old-space-size=2800 tests/ai-v1515-aggregate.cjs
      - name: Verify all controls and protected holdout data
        run: |
          node - <<'JS'
          const fs=require('node:fs'),a=require('node:assert/strict');
          const m=JSON.parse(fs.readFileSync('artifacts/v1515/fullmatch.json','utf8'));
          const q=JSON.parse(fs.readFileSync('artifacts/v1515/report.json','utf8'));
          const t=JSON.parse(fs.readFileSync('artifacts/v1515/training-action-trajectories.json','utf8'));
          a.equal(m.totalMatches,2560);a.equal(m.controls.crossDeckRatio,.8);
          a.equal(m.controls.mirrorRatio,.2);a.equal(m.independentHoldoutGames,640);
          a.equal(m.controls.noAsymmetricHandicaps,true);
          a.equal(q.priorCheckpointLoaded,true);a.ok(q.historicalSources.length>=4);
          a.equal(q.productionEnabled,false);a.equal(m.controls.noProductionPromotion,true);
          a.equal(t.examples.length,m.archivedTrainingTrajectories);
          a.ok(m.modelSummary.every(s=>s.games===640&&s.cross.games===512&&s.mirror.games===128));
          const deep=m.modelSummary.find(x=>x.model==='Q-two-counter-planner');
          const shallow=m.modelSummary.find(x=>x.model==='Q-one-counter-planner');
          a.ok(deep.attackSecondChecks>0,'No second-counter search attempted');
          a.ok(deep.doubleCounters+deep.attackSecondCounters>0,'Second-counter search never executed a legal opponent attack');
          a.equal(shallow.attackSecondChecks+shallow.attackSecondCounters+shallow.doubleCounters,0);
          a.ok(q.candidates.every(x=>x.confirmationAfter!==undefined&&x.confirmationBefore!==undefined));
          a.ok(q.candidates.every(x=>!x.updated || (x.validationAfter>=x.validationBefore&&x.confirmationAfter>=x.confirmationBefore)),
           'Unsafe Q candidate accepted without independent confirmation');
          console.log('ARCANE_V1515_VERIFIED '+JSON.stringify({games:m.totalMatches,
           cross:2048,mirrors:512,holdout:640,trainingTrajectories:t.examples.length,
           historicRunSources:q.historicalSources,acceptedQ:q.updatedQArms,
           wins:m.modelSummary.map(s=>({model:s.model,wins:s.wins,doubleCounters:s.doubleCounters,attackSecond:s.attackSecondCounters})),
           fullTrainingActions:JSON.parse(fs.readFileSync('artifacts/v1515/training-action-trajectories.json','utf8')).examples.reduce((n,x)=>n+x.trajectory.length,0)}));
          JS
      - name: Upload complete Q checkpoints, per-match data and training action trajectories
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arcane-v14915-crossdeck-rollout
          path: artifacts/v1515/
          retention-days: 90
          if-no-files-found: warn
