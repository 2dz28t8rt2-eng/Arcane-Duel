name: Arcane Duel - v15.83 Draw-Safe Deployment Delay Independent Replication
on:
  push:
    branches: [development]
    paths: ['.github/workflows/ai-v1583-deployment-replication.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  preflight:
    name: Check draw-safe evaluation, independent RNG, and sealed research priors
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify all experiment entrypoints and combat regression suites
        run: |
          set -euo pipefail
          node --check tests/ai-v1582-deployment-delay-aggregate.cjs
          node --check tests/ai-v1583-deployment-replication.cjs
          node --check tests/ai-v1583-deployment-aggregate.cjs
          node --test tests/ai-v1575-counterplay.test.cjs tests/ai-v1574-stomp.test.cjs tests/fusion-stomp-v200.test.cjs tests/essence-combat.test.cjs tests/predator-pack-v198.test.cjs
          node tests/helpers/game-runtime.cjs
      - name: Verify historical TRAIN-only sources, not v15.82's failed audit status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/40513311546" --jq '.conclusion')" = success
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/40679804474" --jq '.conclusion')" = success
          mkdir -p /tmp/arcane-v1583-priors artifacts/v1583-priors
          gh run download 40513311546 --repo "$GITHUB_REPOSITORY" --name arcane-v14972-counterplay --dir /tmp/arcane-v1583-priors
          for f in historical-train.json frozen-v1555-champion.json incumbent-policy.json older-q-checkpoint.json previous-training-q.json prior-selfplay-checkpoint.json provenance.json research-balanced-policy.json v1499-prior-q.json endgame-learner.json training-q-and-examples.json; do
            test -s "/tmp/arcane-v1583-priors/$f"
            cp "/tmp/arcane-v1583-priors/$f" "artifacts/v1583-priors/$f"
          done
          node - <<'JS'
          const assert=require('node:assert/strict');
          const x=require('./artifacts/v1583-priors/endgame-learner.json');
          assert.equal(x.sourceRun,40499008498);
          assert.equal(x.split,'train');
          assert.equal(x.holdoutUsed,false);
          assert.equal(x.validationUsed,false);
          console.log('ARCANE_V1583_SEALED_PRIORS_VERIFIED');
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: arcane-v1583-verified-priors
          path: artifacts/v1583-priors/
          retention-days: 90
  research:
    name: ${{ matrix.match }}-stage${{ matrix.stage }}-${{ matrix.mode }}
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        match: [mirror, cross]
        stage: [9, 10]
        mode: [baseline, delay, emergency50-locked, emergency50-open]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: arcane-v1583-verified-priors
          path: artifacts/v1583/${{ matrix.match }}/${{ matrix.mode }}
      - name: Run identical controlled duels with independent RNG and both AI markers
        env:
          ARCANE_V1580_MATCH: ${{ matrix.match }}
          ARCANE_V1583_MODE: ${{ matrix.mode }}
          ARCANE_STAGE: ${{ matrix.stage }}
        run: |
          set -euo pipefail
          for pair in 0 1 2 3 4 5 6 7; do
            for chunk in 0 1; do
              node --expose-gc --max-old-space-size=2400 tests/ai-v1583-deployment-replication.cjs "$ARCANE_STAGE" "$pair" "$chunk"
            done
          done
      - name: Preserve partial shards even on failure
        if: always()
        env:
          ARCANE_V1580_MATCH: ${{ matrix.match }}
          ARCANE_V1583_MODE: ${{ matrix.mode }}
          ARCANE_STAGE: ${{ matrix.stage }}
        run: |
          set -euo pipefail
          dir="${ARCANE_V1580_MATCH}/${ARCANE_V1583_MODE}"
          mkdir -p "artifacts/v1583-export/$dir"
          find "artifacts/v1583/$dir" -maxdepth 1 -name "stage-$ARCANE_STAGE-pair-*.json" -type f -exec cp {} "artifacts/v1583-export/$dir/" \;
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arcane-v1583-data-${{ matrix.match }}-${{ matrix.mode }}-stage${{ matrix.stage }}
          path: artifacts/v1583-export/
          retention-days: 90
          if-no-files-found: warn
  aggregate:
    name: Draw-safe audit of 6144 independent duels and starter parity
    needs: [preflight, research]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: arcane-v1583-data-*
          merge-multiple: true
          path: artifacts/v1583
      - name: Audit draw handling, identical conditions, half-strength attacks and sealed splits
        run: node --max-old-space-size=3200 tests/ai-v1583-deployment-aggregate.cjs
      - name: Require complete validated report without automatically changing game rules
        run: |
          node - <<'JS'
          const assert=require('node:assert/strict');
          const r=require('./artifacts/v1583/analysis/report.json');
          assert.equal(r.status,'completed');
          assert.equal(r.totalDuels,6144);
          assert.equal(r.starterPairs,3072);
          assert.equal(r.labelChecks,1536);
          assert.equal(r.matchedMechanismPairs,4608);
          assert.equal(r.controls.gameplayUntouched,true);
          assert.equal(r.controls.temporaryCombatMultiplierOnly,true);
          assert.equal(r.selection.calculatedFrom,'TRAIN+VALIDATION only');
          assert.equal(r.selection.anyGameplayChange,false);
          console.log('ARCANE_V1583_REPLICATION_VERIFIED');
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arcane-v1583-deployment-6144-report
          path: artifacts/v1583/analysis/report.json
          retention-days: 90
          if-no-files-found: warn
