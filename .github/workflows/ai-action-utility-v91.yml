name: Arcane Duel - Real Action Utility AI v9.1
on:
  push:
    branches: [development]
    paths:
      - 'tests/ai-earned-preiv-v91.cjs'
      - 'tests/ai-action-utility-v91.cjs'
      - 'tests/helpers/ai-action-utility-v91.cjs'
      - '.github/workflows/ai-action-utility-v91.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  earned-action-utility-holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify syntax and legal combat, save and economy rules
        run: |
          node --check tests/ai-earned-preiv-v91.cjs
          node --check tests/ai-action-utility-v91.cjs
          node --check tests/helpers/ai-action-utility-v91.cjs
          node --test tests/ai-fusion-choice-v61.test.cjs tests/ai-fusion-preservation-v62.test.cjs tests/shard-rework-v77.test.cjs tests/monster-roles-forge.test.cjs tests/regression.test.cjs
      - name: Earn new independent tournament IV inventory sources
        env:
          ARCANE_V91_CAREERS: '32'
          ARCANE_V91_TIER_ATTEMPTS: '16'
        run: node tests/ai-earned-preiv-v91.cjs
      - name: Compare real visible-field attack and soul action quality
        env:
          ARCANE_V91_CAREERS: '32'
          ARCANE_V91_MATCH_SEEDS: '2'
        run: node tests/ai-action-utility-v91.cjs
      - name: Supplemental AI decision and legality tests
        run: node --test tests/ai-revamp-v55.test.cjs tests/ai-decision-diagnostics-v62.test.cjs tests/ai-fusion-choice-v61.test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arcane-action-utility-v91
          path: |
            artifacts/ai-earned-preiv-v91.json
            artifacts/ai-defender-coverage-v91.json
          if-no-files-found: warn
          retention-days: 30
