name: Arcane Duel - NPC ACE Relative Decision v10.7
on:
  push:
    branches: [development]
    paths:
      - 'tests/ai-earned-npc-opponents-v107.cjs'
      - 'tests/ai-npc-ace-relative-v107.cjs'
      - '.github/workflows/ai-npc-ace-relative-v107.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-earned-decks-and-npc-ace-relative:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static analysis and original economy / combat rules
        run: |
          node --check tests/ai-earned-npc-opponents-v107.cjs
          node --check tests/ai-npc-ace-relative-v107.cjs
          node --test tests/ai-fusion-choice-v61.test.cjs tests/ai-fusion-preservation-v62.test.cjs tests/monster-roles-forge.test.cjs tests/regression.test.cjs
      - name: Earn 32 new independent legal player decks
        env:
          ARCANE_V107_CAREERS: '32'
          ARCANE_V107_TIER_ATTEMPTS: '24'
        run: node tests/ai-earned-npc-opponents-v107.cjs
      - name: Paired NPC original vs aggressive vs relative ACE decision
        run: node tests/ai-npc-ace-relative-v107.cjs
      - name: Existing AI and legality regressions
        run: node --test tests/ai-revamp-v55.test.cjs tests/ai-decision-diagnostics-v62.test.cjs tests/ai-fusion-choice-v61.test.cjs
      - name: Archive earned inventory and every NPC match and decision
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arcane-npc-ace-relative-v107
          path: |
            artifacts/ai-earned-player-decks-v107.json
            artifacts/ai-npc-ace-relative-v107.json
          if-no-files-found: warn
          retention-days: 30
