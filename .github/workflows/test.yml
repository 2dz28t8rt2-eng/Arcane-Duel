name: Arcane Duel smoke tests
on:
  push:
    branches: [development]
  pull_request:
    branches: [main, development]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run tests
        run: npm test
