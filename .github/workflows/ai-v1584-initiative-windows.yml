name: Arcane Duel - v15.84 Initiative Window Causal Experiment
on:
  push:
    branches: [development]
    paths: ['.github/workflows/ai-v1584-initiative-windows.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  preflight:
    name: Verify mechanics, sealed TRAIN priors, and research entrypoints
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check experiment and core-combat regressions
        run: |
          set -euo pipefail
          node --check tests/ai-v1584-initiative-windows.cjs
          node --check tests/ai-v1584-initiative-aggregate.cjs
          node --check tests/ai-v1582-deployment-delay.cjs
          node --check tests/ai-v1582-deployment-delay-aggregate.cjs
          node --test tests/ai-v1575-counterplay.test.cjs tests/ai-v1574-stomp.test.cjs tests/fusion-stomp-v200.test.cjs tests/essence-combat.test.cjs tests/predator-pack-v198.test.cjs
          node tests/helpers/game-runtime.cjs
      - name: Verify historical TRAIN-only knowledge and independently completed v15.83
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/40513311546" --jq '.conclusion')" = success
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/40704495982" --jq '.conclusion')" = success
          mkdir -p /tmp/arcane-v1584-priors artifacts/v1584-priors
          gh run download 40513311546 --repo "$GITHUB_REPOSITORY" --name arcane-v14972-counterplay --dir /tmp/arcane-v1584-priors
          for f in historical-train.json frozen-v1555-champion.json incumbent-policy.json older-q-checkpoint.json previous-training-q.json prior-selfplay-checkpoint.json provenance.json research-balanced-policy.json v1499-prior-q.json endgame-learner.json training-q-and-examples.json; do
            test -s "/tmp/arcane-v1584-priors/$f"
            cp "/tmp/arcane-v1584-priors/$f" "artifacts/v1584-priors/$f"
          done
          node - <<'JS'
          const assert=require('node:assert/strict');
          const x=require('./artifacts/v1584-priors/endgame-learner.json');
          assert.equal(x.sourceRun,40499008498);
          assert.equal(x.split,'train');
          assert.equal(x.holdoutUsed,false);
          assert.equal(x.validationUsed,false);
          console.log('ARCANE_V1584_TRAIN_PRIORS_VERIFIED');
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: arcane-v1584-verified-priors
          path: artifacts/v1584-priors/
          retention-days: 90
  research:
    name: ${{ matrix.match }}-stage${{ matrix.stage }}-${{ matrix.mode }}
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        match: [mirror, cross]
        stage: [9, 10]
        mode: [baseline, release3, release4, release5, delay]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: arcane-v1584-verified-priors
          path: artifacts/v1584/${{ matrix.match }}/${{ matrix.mode }}
      - name: Run fixed-deck fixed-policy identical-seed duels with swapped starters
        env:
          ARCANE_V1580_MATCH: ${{ matrix.match }}
          ARCANE_V1584_MODE: ${{ matrix.mode }}
          ARCANE_STAGE: ${{ matrix.stage }}
        run: |
          set -euo pipefail
          for pair in 0 1 2 3 4 5 6 7; do
            for chunk in 0 1; do
              node --expose-gc --max-old-space-size=2400 tests/ai-v1584-initiative-windows.cjs "$ARCANE_STAGE" "$pair" "$chunk"
            done
          done
      - name: Preserve partial research evidence even after failure
        if: always()
        env:
          ARCANE_V1580_MATCH: ${{ matrix.match }}
          ARCANE_V1584_MODE: ${{ matrix.mode }}
          ARCANE_STAGE: ${{ matrix.stage }}
        run: |
          set -euo pipefail
          dir="${ARCANE_V1580_MATCH}/${ARCANE_V1584_MODE}"
          mkdir -p "artifacts/v1584-export/$dir"
          find "artifacts/v1584/$dir" -maxdepth 1 -name "stage-$ARCANE_STAGE-pair-*.json" -type f -exec cp {} "artifacts/v1584-export/$dir/" \;
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arcane-v1584-data-${{ matrix.match }}-${{ matrix.mode }}-stage${{ matrix.stage }}
          path: artifacts/v1584-export/
          retention-days: 90
          if-no-files-found: warn
  aggregate:
    name: Audit 7680 duel records, independent initiative windows and seat parity
    needs: [preflight, research]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: arcane-v1584-data-*
          merge-multiple: true
          path: artifacts/v1584
      - name: Verify legal attack windows and complete draw-safe paired cohorts
        run: node --max-old-space-size=3200 tests/ai-v1584-initiative-aggregate.cjs
      - name: Require audited result without changing published combat rules
        run: |
          node - <<'JS'
          const assert=require('node:assert/strict');
          const r=require('./artifacts/v1584/analysis/report.json');
          assert.equal(r.status,'completed');
          assert.equal(r.totalDuels,7680);
          assert.equal(r.starterPairs,3840);
          assert.equal(r.labelChecks,1920);
          assert.equal(r.matchedMechanismPairs,6144);
          assert.deepEqual(r.modes,['baseline','release3','release4','release5','delay']);
          assert.equal(r.controls.gameplayUntouched,true);
          assert.equal(r.controls.attackTimingOnly,true);
          assert.equal(r.controls.oneSidedSeatPerksOff,true);
          assert.equal(r.controls.noSixthCard,true);
          assert.equal(r.selection.calculatedFrom,'TRAIN+VALIDATION only');
          assert.equal(r.selection.anyGameplayChange,false);
          console.log('ARCANE_V1584_INITIATIVE_CAUSAL_AUDIT_VERIFIED');
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arcane-v1584-initiative-7680-report
          path: artifacts/v1584/analysis/report.json
          retention-days: 90
          if-no-files-found: warn
