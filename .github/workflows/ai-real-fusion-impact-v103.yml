name: Arcane Duel - Real Fusion Impact v10.3
on:
  push:
    branches: [development]
    paths:
      - 'tests/ai-real-fusion-impact-v103.cjs'
      - '.github/workflows/ai-real-fusion-impact-v103.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-fusion-impact-earned-careers:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Legal fusion, deck and economy regressions
        run: |
          node --check tests/ai-real-fusion-impact-v103.cjs
          node --check tests/helpers/ai-pre-attack-v92.cjs
          node --test tests/ai-fusion-choice-v61.test.cjs tests/ai-fusion-preservation-v62.test.cjs tests/shard-rework-v77.test.cjs tests/monster-roles-forge.test.cjs tests/regression.test.cjs
      - name: Test real fusion impact on 32 independent earned careers and 75 VI fights
        env:
          ARCANE_V103_CAREERS: '32'
          ARCANE_V103_TIER_ATTEMPTS: '24'
        run: node tests/ai-real-fusion-impact-v103.cjs
      - name: Original AI and gameplay regression checks
        run: node --test tests/ai-revamp-v55.test.cjs tests/ai-decision-diagnostics-v62.test.cjs tests/ai-fusion-choice-v61.test.cjs
      - name: Archive actual fusion placements, damage and holdout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arcane-actual-fusion-impact-v103
          path: artifacts/ai-fusion-impact-v103.json
          if-no-files-found: warn
          retention-days: 30
