name: Arcane Duel – Economy and Perk Baseline v7.6
on:
  push:
    branches: [development]
    paths:
      - 'tests/ai-real-economy-audit-v76.cjs'
      - '.github/workflows/ai-economy-audit-v76.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  economy-catalogue-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify the audited economy code compiles
        run: node --check tests/ai-real-economy-audit-v76.cjs
      - name: Audit the actual booster, loot, shards, perks, and 16 late-game monster pools
        run: node tests/ai-real-economy-audit-v76.cjs
      - name: Run progression and card source regressions
        run: |
          node --test tests/lategame-monsters-v71.test.cjs tests/progression-audit.test.cjs tests/ai-learning-v56.test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arcane-economy-and-perks-v76
          path: artifacts/ai-v76-real-economy-audit.json
          if-no-files-found: warn
          retention-days: 30
