name: Arcane Duel – Code & Strategy Checks

on:
  push:
    branches: [development]
  pull_request:
    branches: [development]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strategy-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate syntax of gameplay and extensions
        run: |
          for js in assets/*.js; do
            node --check "$js"
          done
      - name: Execute deterministic 40-card analysis tests
        run: node --test tests/strategy-engine.test.cjs
      - name: Smoke-test real gameplay with isolated synthetic profiles
        run: node tests/battle-simulator.cjs --samples 5

      - name: Run Essence combat and save-safety regressions
        run: node --test tests/essence-combat.test.cjs
      - name: Run level crafting and role-fusion regressions
        run: node --test tests/arcane-overhaul.test.cjs
      - name: Monster families, field roles and workshop regression
        run: node --test tests/monster-roles-forge.test.cjs
      - name: QA sample - 600 seeded solo duels across I-X
        run: |
          node tests/battle-simulator.cjs --samples 15 --json > /tmp/arcane-qa-solo.json
          node -e 'const r=require("/tmp/arcane-qa-solo.json");console.log("QA_SOLO_20261017 "+JSON.stringify({battles:r.battles,errors:r.errors,rows:r.rows}))'
      - name: QA sample - 24 connected tournament careers
        run: node tests/evolution-full-tournament-audit.cjs

      - name: QA October 17 full-runtime duels and 18 connected careers
        run: node tests/qa-balance-current.cjs

      - name: QA paired defender Seelenraub active vs passive
        run: node tests/qa-soul-active-comparison.cjs

      - name: QA tight equal-seed soul survival and skill matches
        run: node tests/qa-tight-soul-matches.cjs

      - name: QA defender tactical stress against harder matched NPCs
        run: node tests/qa-soul-pressure-matches.cjs

      - name: QA real field fusion battle comparison for stored souls
        run: node tests/qa-charged-field-fusion-matches.cjs
