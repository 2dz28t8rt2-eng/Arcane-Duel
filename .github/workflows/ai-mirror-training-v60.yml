name: Arcane Duel – Stage Deck & Mirror AI v6.0
on:
  push:
    branches: [development]
    paths:
      - 'tests/helpers/stage-owned-decks-v60.cjs'
      - 'tests/stage-owned-decks-v60.test.cjs'
      - 'tests/ai-mirror-training-v60.cjs'
      - 'tests/ai-fusion-choice-v61.test.cjs'
      - 'assets/game.js'
      - '.github/workflows/ai-mirror-training-v60.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mirrored-opponent-training:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate authentic starter inventory and stage-source constraints
        run: node --test tests/stage-owned-decks-v60.test.cjs
      - name: Verify chosen fusion dispatcher and invalid fusion rejection
        run: node --test tests/ai-fusion-choice-v61.test.cjs
      - name: Run exact 40-card and fusion-deck mirror comparisons
        env:
          ARCANE_MIRROR_TRAIN_SEEDS: '3'
          ARCANE_MIRROR_HOLDOUT_SEEDS: '5'
          ARCANE_MIRROR_TIERS: '10'
        run: |
          if test -f tests/ai-mirror-training-v60.cjs; then
            node tests/ai-mirror-training-v60.cjs
          else
            echo "Stage ownership validated; mirror tournament harness being installed."
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arcane-ai-mirror-training-v60
          path: artifacts/ai-mirror-training-v60.json
          if-no-files-found: ignore
          retention-days: 30
