name: Arcane Duel - Tactical Board AI Training v8.7
on:
  push:
    branches: [development]
    paths:
      - 'tests/ai-earned-preiv-v87.cjs'
      - 'tests/ai-tactical-training-v87.cjs'
      - 'tests/helpers/ai-tactical-v87.cjs'
      - '.github/workflows/ai-tactical-v87.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  matched-board-tactics:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax, legal attack, defense and save checks
        run: |
          node --check tests/ai-earned-preiv-v87.cjs
          node --check tests/ai-tactical-training-v87.cjs
          node --check tests/helpers/ai-tactical-v87.cjs
          node --test tests/ai-fusion-choice-v61.test.cjs tests/ai-fusion-preservation-v62.test.cjs tests/shard-rework-v77.test.cjs tests/monster-roles-forge.test.cjs tests/regression.test.cjs
      - name: Earn new independent careers before tournament IV
        env:
          ARCANE_V87_CAREERS: '32'
          ARCANE_V87_TIER_ATTEMPTS: '16'
        run: node tests/ai-earned-preiv-v87.cjs
      - name: Train and validate matched board, defense and soul tactics
        env:
          ARCANE_V87_CAREERS: '32'
          ARCANE_V87_MATCH_SEEDS: '2'
        run: node tests/ai-tactical-training-v87.cjs
      - name: Supplemental AI action regression
        run: node --test tests/ai-revamp-v55.test.cjs tests/ai-decision-diagnostics-v62.test.cjs tests/ai-fusion-choice-v61.test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arcane-tactical-board-v87
          path: |
            artifacts/ai-earned-preiv-v87.json
            artifacts/ai-tactical-v87.json
          if-no-files-found: warn
          retention-days: 30
