name: Arcane Art Import – temporary
on:
  push:
    branches: [development]
    paths:
      - ".github/workflows/arcane-art-import-once.yml"
permissions:
  contents: write
jobs:
  create-three-original-webps:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
      - name: Install image encoder
        run: python -m pip install --quiet pillow
      - name: Validate and convert Runway illustrations to local WebP files
        shell: bash
        run: |
          python - <<'ARCANE_PYTHON'
          import io, pathlib, urllib.request
          from PIL import Image
          ASSETS = [{"filename":"assets/custom-art/fate/nebelkaiser.webp","url":"https://dnznrvs05pmza.cloudfront.net/c7713f51-368d-4ad2-bb7c-d836029246bb.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiNTk4NjUzNWFkYmUwNWU3OCIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MjUzODU4Nn0.Dz9tlbHUvCufktL9-YCIvL4cwnJXI27Au00qpKnGMLI"},{"filename":"assets/custom-art/flagship/leerenorakel.webp","url":"https://dnznrvs05pmza.cloudfront.net/4905982c-cec9-42b8-89bf-c76a7da80448.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiNTkyNmM0MWIzZmU0YTFkYiIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MjQ5Njc5NX0.1FfI7Hx_sognO3A-mIVor5BpNVj9Ec4ZQ6mybFx9pK0"},{"filename":"assets/custom-art/flagship/runengeist-der-schwelle.webp","url":"https://dnznrvs05pmza.cloudfront.net/61cf0d4a-810d-4961-afeb-af0ce0ad5a7e.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMzMxNTFlYzk5ODdmMTQyOSIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MjU2MTM1M30.ZkMQSjKVAEpBGNK7xG2M2n3K7zW7VvzfAa_PqcgpwHk"}]
          for entry in ASSETS:
              url = entry["url"]
              dest = pathlib.Path(entry["filename"])
              assert url.startswith("https://dnznrvs05pmza.cloudfront.net/"), "Untrusted image host"
              request = urllib.request.Request(url, headers={"User-Agent": "ArcaneDuelArtworkImport/1.0"})
              with urllib.request.urlopen(request, timeout=75) as response:
                  original = response.read(16_000_000)
              assert len(original) > 50_000, "Generated image too small"
              with Image.open(io.BytesIO(original)) as image:
                  image.load()
                  assert image.width >= 900 and image.height >= 1200, "Insufficient image resolution"
                  assert image.width / image.height > 0.7 and image.width / image.height < 0.85, "Wrong portrait aspect"
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  image.convert("RGB").save(dest, format="WEBP", quality=91, method=6)
              check = dest.read_bytes()
              assert check[:4] == b"RIFF" and check[8:12] == b"WEBP"
              assert len(check) > 80_000, "Unexpectedly tiny WebP"
              print("VALIDATED", dest, len(check), "bytes")
          
          ARCANE_PYTHON
      - name: Save original art into development
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/custom-art/fate/nebelkaiser.webp assets/custom-art/flagship/leerenorakel.webp assets/custom-art/flagship/runengeist-der-schwelle.webp
          git commit -m "art: import three original fantasy monster portraits as WebP"
          git push origin HEAD:development
