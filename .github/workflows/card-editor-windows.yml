name: Karten-Editor Windows
on:
  pull_request:
    paths:
      - 'tools/card-editor/**'
      - '.github/workflows/card-editor-windows.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build standalone EXE
        run: dotnet publish tools/card-editor/ArcaneDuelKartenEditor.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o out
      - name: Card data, preview and package smoke test
        shell: pwsh
        run: |
          $p = Start-Process -FilePath out/ArcaneDuelKartenEditor.exe -ArgumentList '--self-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Self-test failed: $($p.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: Arcane-Duel-Karten-Editor-Windows
          path: out/ArcaneDuelKartenEditor.exe
          if-no-files-found: error
          retention-days: 90
