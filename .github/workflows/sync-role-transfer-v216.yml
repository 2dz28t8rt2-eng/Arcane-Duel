name: Sync Duo catalogs after role transfer v216
on:
  push:
    branches: [development]
    paths:
      - 'assets/role-transfer-v216.js'
      - '.github/workflows/sync-role-transfer-v216.yml'
      - 'tests/helpers/game-runtime.cjs'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: arcane-v216-duo-catalog-sync
  cancel-in-progress: false
jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate exact browser and server Duo catalogs from live Solo rules
        run: |
          node scripts/build-duo-catalog-v160.cjs
          node scripts/build-duo-catalog-v160.cjs --check
          node --test tests/role-transfer-v216.test.cjs tests/guardian-balance-v212.test.cjs
      - name: Commit synchronized catalogs
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/duo-card-catalog-v160.json supabase/functions/arcane-duo-v2/catalog.json
          if git diff --cached --quiet; then
            echo 'Duo catalog is already synchronized.'
            exit 0
          fi
          git commit -m "fix(duo): sync v216 transferred role values with Solo catalog"
          git pull --rebase origin development
          git push origin HEAD:development
