name: Arcane Duel - ACE vs Tempo Real Careers v9.5
on:
  push:
    branches: [development]
    paths:
      - 'tests/ai-real-career-ace-v95.cjs'
      - '.github/workflows/ai-real-career-ace-v95.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paired-ace-vi-holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify engine compatibility and owned card legality
        run: |
          node --check tests/ai-real-career-ace-v95.cjs
          node --check tests/helpers/ai-pre-attack-v92.cjs
          node --test tests/ai-fusion-choice-v61.test.cjs tests/ai-fusion-preservation-v62.test.cjs tests/shard-rework-v77.test.cjs tests/monster-roles-forge.test.cjs tests/regression.test.cjs
      - name: Real earned careers with unchanged tempo versus ACE policy
        env:
          ARCANE_V95_CAREERS: '32'
          ARCANE_V95_TIER_ATTEMPTS: '16'
        run: node tests/ai-real-career-ace-v95.cjs
      - name: Supplemental NPC AI & strategy regressions
        run: node --test tests/ai-revamp-v55.test.cjs tests/ai-decision-diagnostics-v62.test.cjs tests/ai-fusion-choice-v61.test.cjs
      - name: Preserve paired VI profiles, rewards, attempts and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arcane-real-career-ace-v95
          path: artifacts/ai-real-career-ace-v95.json
          if-no-files-found: warn
          retention-days: 30
