name: Arcane Duel - v14.9.28 Global Five-Stage Role Strategy Selection and Adaptive Self-Play
on:
  push:
    branches: [development]
    paths:
      - '.github/workflows/ai-v14928-global-policy-selection.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  two-sided-soul-guardian-learning:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify syntax, legal position rules and combat mechanics
        run: |
          set -euo pipefail
          node --check tests/ai-v1528-history.cjs
          node --check tests/ai-v1528-Q.cjs
          node --check tests/ai-v1528-global-policy-selfplay.cjs
          node --check tests/ai-v1528-global-policy-aggregate.cjs
          node --test tests/predator-armor-live-v1499.test.cjs tests/predator-swarm-live-v1498.test.cjs tests/essence-combat.test.cjs tests/strategic-seat-parity-v1495.test.cjs
      - name: Restore verified Q checkpoint and seventeen historical TRAIN-only archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/arcane-prev /tmp/arcane-history/{v1511,v1512,v1513,v1514,v1515,v1516,v1517,v1518,v1519,v1520,v1521,v1522,v1523,v1524,v1525,v1526,v1527} artifacts/v1528
          for rid in 39803691439 39843438099 39847734409 39851537706 39855753529 39858417967 39862370629 39904678414 39907484021 39911997726 39919243971 39925937764 39930044938 39933155444 39937859539 39942452732 39963832441; do
            test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$rid" --jq '.conclusion')" = success
          done
          gh run download 39803691439 --repo "$GITHUB_REPOSITORY" --name arcane-v14911-summon-fusion-training --dir /tmp/arcane-history/v1511
          gh run download 39843438099 --repo "$GITHUB_REPOSITORY" --name arcane-v14912-veteran-predator-training --dir /tmp/arcane-history/v1512
          gh run download 39847734409 --repo "$GITHUB_REPOSITORY" --name arcane-v14913-symmetric-history --dir /tmp/arcane-history/v1513
          gh run download 39851537706 --repo "$GITHUB_REPOSITORY" --name arcane-v14914-crossdeck-history --dir /tmp/arcane-history/v1514
          gh run download 39855753529 --repo "$GITHUB_REPOSITORY" --name arcane-v14915-crossdeck-rollout --dir /tmp/arcane-history/v1515
          gh run download 39858417967 --repo "$GITHUB_REPOSITORY" --name arcane-v14916-risk-aware-crossdeck --dir /tmp/arcane-history/v1516
          gh run download 39862370629 --repo "$GITHUB_REPOSITORY" --name arcane-v14917-role-aware-crossdeck --dir /tmp/arcane-history/v1517
          gh run download 39904678414 --repo "$GITHUB_REPOSITORY" --name arcane-v14918-optimized-roles-decay --dir /tmp/arcane-history/v1518
          gh run download 39907484021 --repo "$GITHUB_REPOSITORY" --name arcane-v14919-fusion-soul-isolation --dir /tmp/arcane-history/v1519
          gh run download 39911997726 --repo "$GITHUB_REPOSITORY" --name arcane-v14920-siege-curriculum --dir /tmp/arcane-history/v1520
          gh run download 39919243971 --repo "$GITHUB_REPOSITORY" --name arcane-v14921-progressive-siege --dir /tmp/arcane-history/v1521
          gh run download 39925937764 --repo "$GITHUB_REPOSITORY" --name arcane-v14922-finishers-seat-parity --dir /tmp/arcane-history/v1522
          gh run download 39930044938 --repo "$GITHUB_REPOSITORY" --name arcane-v14923-seat-breach-training --dir /tmp/arcane-history/v1523
          gh run download 39933155444 --repo "$GITHUB_REPOSITORY" --name arcane-v14924-active-transfer --dir /tmp/arcane-history/v1524
          gh run download 39937859539 --repo "$GITHUB_REPOSITORY" --name arcane-v14925-test-ai-selfplay --dir /tmp/arcane-history/v1525
          gh run download 39942452732 --repo "$GITHUB_REPOSITORY" --name arcane-v14926-guardian-soul-selfplay --dir /tmp/arcane-history/v1526
          gh run download 39963832441 --repo "$GITHUB_REPOSITORY" --name arcane-v14927-role-generalization --dir /tmp/arcane-history/v1527
          cp /tmp/arcane-history/v1527/training-q-and-examples.json /tmp/arcane-prev/training-q-and-examples.json
          echo "ARCANE_V1528_RESTORED 39963832441"
          node tests/ai-v1528-history.cjs
      - name: Restore prior Q and weights as FROZEN opponent checkpoint
        run: |
          set -euo pipefail
          node - <<'JS'
          const fs=require('node:fs'),a=require('node:assert/strict');
          const old=JSON.parse(fs.readFileSync('/tmp/arcane-history/v1525/training-q-and-examples.json','utf8'));
          const previousQ=old.find(x=>x.swarm===.02&&x.pierce===.10)?.learnedQ;
          a.ok(previousQ&&Object.keys(previousQ).length>=160);
          fs.writeFileSync('artifacts/v1528/older-q-checkpoint.json',JSON.stringify(previousQ));
          const last=JSON.parse(fs.readFileSync('/tmp/arcane-history/v1526/stage-4.json','utf8'));
          const priors=JSON.parse(fs.readFileSync('/tmp/arcane-history/v1526/selfplay-priors.json','utf8'));
          a.equal(priors.holdoutUsed,false);
          const weights=last.selectedWeights||priors.weights;
          a.ok(['breach','reserve','support'].every(k=>Number.isFinite(weights[k])));
          fs.writeFileSync('artifacts/v1528/prior-selfplay-checkpoint.json',
            JSON.stringify({source:39942452732,holdoutUsed:false,weights}));
          console.log('ARCANE_V1528_OLDER_CHECKPOINT '+JSON.stringify({
            qKeys:Object.keys(previousQ).length,weights}));
          JS
      - name: Continue 17-run protected tactical Q learning
        run: node --expose-gc --max-old-space-size=3200 tests/ai-v1528-Q.cjs
      # Deck builder accepts only integer seeds between 0 and 9999; values bounded in research runner.
      # Batch isolation fixes confirmed 2.9GB Node OOM in 960-match monolithic phase. Each batch handles exactly 120 matches.
      - name: Phase 0 - Level-8 identical-deck transfer
        run: |
          set -euo pipefail
          for pair in 0 1 2 3 4 5 6 7; do
            node --expose-gc --max-old-space-size=1900 tests/ai-v1528-global-policy-selfplay.cjs 0 "$pair"
          done
          node --max-old-space-size=1400 tests/ai-v1528-global-policy-selfplay.cjs 0 finalize
          node - <<'JS'
          const fs=require('node:fs'),a=require('node:assert/strict');
          const s=JSON.parse(fs.readFileSync('artifacts/v1528/stage-0.json','utf8'));
          a.equal(s.allCases.length,960);a.equal(s.summaries.length,5);
          a.equal(s.trainCandidate.games,64);
          a.equal(s.validationCandidate.games,64);
          a.equal(s.holdoutCandidate.games,64);
          a.ok(s.allCases.every(r=>r.mirror&&r.illegalSwitchesBySeat.every(n=>n===0)));
          a.ok(s.allCases.every(r=>r.selfPlayStrategicBySeat.every(n=>n>0)));
          a.ok(s.allCases.some(r=>r.foeCheckpoint==='v1526'));
          a.equal(s.chosenArm,'pool-reference','No stage selection before the global gate');
          a.equal(s.promoted,false);
          a.equal(s.controls.globalSelectionOnly,true);
          a.equal(s.controls.noStageToStagePolicyInheritance,true);
          a.ok(s.summaries.some(r=>r.arm==='board-adaptive'&&r.rolePolicy.adaptive));
          console.log('ARCANE_V1528_PHASE0 '+JSON.stringify({games:960,
            fixedCandidateNames:s.summaries.map(x=>x.arm),
            training:s.trainBaseline.wins,validation:s.validationBaseline.wins}));
          JS
      - name: Phase 1 - Level-9 identical-deck transfer
        run: |
          set -euo pipefail
          for pair in 0 1 2 3 4 5 6 7; do
            node --expose-gc --max-old-space-size=1900 tests/ai-v1528-global-policy-selfplay.cjs 1 "$pair"
          done
          node --max-old-space-size=1400 tests/ai-v1528-global-policy-selfplay.cjs 1 finalize
      - name: Phase 2 - Level-10 identical-deck transfer
        run: |
          set -euo pipefail
          for pair in 0 1 2 3 4 5 6 7; do
            node --expose-gc --max-old-space-size=1900 tests/ai-v1528-global-policy-selfplay.cjs 2 "$pair"
          done
          node --max-old-space-size=1400 tests/ai-v1528-global-policy-selfplay.cjs 2 finalize
      - name: Phase 3 - Level-8 cross-role transfer
        run: |
          set -euo pipefail
          for pair in 0 1 2 3 4 5 6 7; do
            node --expose-gc --max-old-space-size=1900 tests/ai-v1528-global-policy-selfplay.cjs 3 "$pair"
          done
          node --max-old-space-size=1400 tests/ai-v1528-global-policy-selfplay.cjs 3 finalize
      - name: Phase 4 - Level-10 cross-role transfer
        run: |
          set -euo pipefail
          for pair in 0 1 2 3 4 5 6 7; do
            node --expose-gc --max-old-space-size=1900 tests/ai-v1528-global-policy-selfplay.cjs 4 "$pair"
          done
          node --max-old-space-size=1400 tests/ai-v1528-global-policy-selfplay.cjs 4 finalize
      - name: Globally select fixed policies across all five selfplay phases
        run: node --max-old-space-size=3200 tests/ai-v1528-global-policy-aggregate.cjs
      - name: Verify global TRAIN plus VALIDATION selection and sealed HOLDOUT evaluation
        run: |
          set -euo pipefail
          node - <<'JS'
          const fs=require('node:fs'),a=require('node:assert/strict');
          const root='artifacts/v1528/';
          const report=JSON.parse(fs.readFileSync(root+'report.json','utf8'));
          const historic=JSON.parse(fs.readFileSync(root+'historical-train.json','utf8'));
          a.equal(historic.sources.length,17);
          a.equal(report.totalDuels,4800);
          a.equal(report.trainDuels,1600);
          a.equal(report.validationDuels,1600);
          a.equal(report.holdoutDuels,1600);
          a.equal(report.controls.globalFiveStageSelection,true);
          a.equal(report.controls.stageLocalPromotionDisabled,true);
          a.equal(report.controls.holdoutNeverUsedForSelection,true);
          const selected=report.globalSelection;
          a.equal(selected.holdoutSeenBySelector,false);
          a.deepEqual(selected.selectionBasedOn,['train','validation']);
          a.ok(report.arms.some(x=>x.arm===selected.arm));
          for(let phase=0;phase<5;phase++){
            const s=JSON.parse(fs.readFileSync(root+'stage-'+phase+'.json','utf8'));
            a.equal(s.allCases.length,960);
            a.equal(s.summaries.length,5);
            a.equal(s.chosenArm,'pool-reference');
            a.equal(s.promoted,false);
            a.equal(s.previousSelectedRolePolicy,null);
            a.equal(s.trainCandidate.games,64);
            a.equal(s.validationCandidate.games,64);
            a.equal(s.holdoutCandidate.games,64);
            a.ok(s.allCases.every(x=>x.illegalSwitchesBySeat.every(n=>n===0)));
            a.ok(s.allCases.every(x=>x.selfPlayStrategicBySeat.every(n=>n>0)));
          }
          const base=report.arms.find(x=>x.arm==='pool-reference');
          const c=report.arms.find(x=>x.arm===selected.arm);
          a.equal(selected.holdoutDifference,c.splits.holdout.wins-base.splits.holdout.wins);
          if(selected.promoted){
            const gate=selected.candidates.find(x=>x.arm===selected.arm);
            a.ok(gate&&gate.qualifies);
            a.ok(gate.trainGain>=12&&gate.validationGain>=10&&gate.seatParity);
            a.ok(Object.values(gate.groups).every(x=>x>=-4));
          }else a.equal(selected.arm,'pool-reference');
          console.log('ARCANE_V1528_GLOBAL_VERIFIED '+JSON.stringify({
            games:report.totalDuels,selected:selected.arm,
            promoted:selected.promoted,holdoutDifference:selected.holdoutDifference,
            candidates:selected.candidates}));
          JS
      - name: Archive globally selected selfplay strategies, Q states and three disjoint cohorts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arcane-v14928-global-policy-selection
          path: artifacts/v1528/
          retention-days: 90
          if-no-files-found: warn
