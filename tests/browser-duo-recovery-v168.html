<!doctype html><html lang="de"><head><meta charset="utf-8"><title>2v2 v16.8 session QA</title></head>
<body><pre id="result">Lädt …</pre><iframe id="duo" src="../duo-campaign-v2.html" width="1000" height="900"></iframe>
<script>
document.getElementById('duo').addEventListener('load',()=>{
 setTimeout(()=>{
  const d=document.getElementById('duo').contentDocument,w=document.getElementById('duo').contentWindow;
  const notes=[];let ok=true;
  function check(test,text){if(!test)ok=false;notes.push((test?'OK ':'FAIL ')+text);}
  try{
   const recovery=w.ArcaneDuoRecovery168;
   check(recovery?.version==='16.8','Private recovery module is available');
   check(!!d.getElementById('duoRecoveryArea')&&!!d.getElementById('duoRecoveryCopy'),
    'Recovery controls are accessible');
   check(d.getElementById('duoRecoveryArea').hidden,
    'No recovery link is visible before room authorization');
   check(d.getElementById('duoRecoveryLink').hidden,
    'Bearer secret never appears without explicit user action');
   check(!!d.querySelector('script[src*="duo-recovery-v168"]'),
    'Recovery helpers loaded before main client');
   check(d.querySelector('.duo-guide').textContent.includes('Wiederherstellungslink'),
    'User-facing resumption explanation');
   check(recovery?.pollDelay(4)===30000,'Polling backoff is capped');
   const room='abc12345-0123-4abc-8765-aabbccddeeff',secret='a'.repeat(64);
   const url=recovery.link(location.origin+location.pathname,room,secret);
   check(recovery.parse(new URL(url).hash)?.token===secret,'Token survives another browser/device');
   check(recovery.parse('#resume=invalid')===null,'Invalid recovery hash rejected');
  }catch(e){check(false,e.stack||e.message);}
  document.getElementById('result').textContent=notes.join('\n');
  document.documentElement.dataset.duoRecovery=ok?'pass':'fail';
 },1300);
});
</script></body></html>
