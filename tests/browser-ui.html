<!doctype html><html lang="de"><head><meta charset="utf-8"><title>Arcane Duel – Alpha 1.9 UI Integration</title>
<style>body{font:14px system-ui;background:#111827;color:#fff;padding:12px}iframe{width:100%;height:520px;border:1px solid #777}#result{white-space:pre-wrap}</style>
</head><body><h1>Gameplay-UI smoke test</h1><pre id="result">Running ...</pre>
<iframe id="app" src="../index.html" title="Alpha 1.9"></iframe>
<script>
const iframe=document.getElementById('app'),r=document.getElementById('result');
iframe.addEventListener('load',async()=>{
 let steps=[],pass=true;
 function expect(check,label){steps.push((check?'OK: ':'FEHLER: ')+label);if(!check)pass=false;}
 try{
  const w=iframe.contentWindow,d=w.document;
  expect(!!w.ArcaneExpansion,'Alpha 2.2 extension available');
  const showcase=()=>[...d.querySelectorAll('#menuHero .atlas-preview-card img')].map(img=>img.getAttribute('src'));
  const previousShowcase=showcase();
  expect(previousShowcase.length===3,'Main menu shows three monsters instead of a static gallery');
  w.ArcaneArchiveTheme.rotateShowcase();
  expect(!!d.querySelector('.atlas-showcase-cards.atlas-depart'),'Showcase starts an animated disappearance');
  await new Promise(resolve=>setTimeout(resolve,530));
  expect(showcase().length===3&&!showcase().every((src,i)=>src===previousShowcase[i]),
   'Showcase rotates to three different artworks after the disappearing transition');
  expect(!!d.querySelector('.atlas-showcase-cards.atlas-arrive'),'Showcase animated reappearance runs');

  expect(d.querySelector('.guide-spread')!==null,'First-run guide has double page');
  d.getElementById('guideNext')?.click();
  expect(d.querySelector('.guide-header')?.textContent.includes('Deine Monsterkarte'),'Guide navigates to next chapter');
  d.getElementById('guideClose')?.click();
  expect(d.getElementById('modal')?.textContent.includes('Duellantenhandbuch gespeichert'),'Guide explains later Lexicon access');
  d.getElementById('helpDismiss')?.click();
  w.eval('profile.trainingWins=3;profile.cleared=[1];profile.dropCharges=2;profile.coins=999999;menuTab="free";saveProfile();renderMenu()');
  expect(d.querySelector('[data-action="quick-pack"][data-id="1"]')!==null,'Free duel has direct character-pack button');
  const button=d.getElementById('hudDropToggle');
  expect(button!==null,'HUD drop charge toggle present');
  button?.click();
  expect(!!d.querySelector('.charged-opponent'),'Boost immediately colors opponent cards');
  expect(!!d.querySelector('.reward-preview'),'Opponent cards show predicted loot');
  w.eval('profile.packs[packKey(1,"easy")]=1;saveProfile();renderMenu()');
  d.querySelector('[data-action="quick-pack"][data-id="1"]')?.click();
  expect(d.querySelector('.pack-grid')!==null,'Pack quick-open actually opens selection');
  d.querySelector('[data-pack-pick="0"]')?.click();
  d.getElementById('packFinish')?.click();
  expect(w.eval('profile.openPack===null'),'Quick-open pack can be completed and closed');
  w.eval('menuTab="shop";renderMenu()');
  expect(d.querySelector('.ace-market')!==null,'ACE market available after tournament victory');
  expect(d.querySelector('.ace-market .ace-thumbnail')!==null,'ACE shop shows its own card artwork and rarity label');
  d.querySelector('[data-action="buy-ace"][data-id="1"]')?.click();
  expect(w.eval('profile.acePurchased.includes(1)'),'ACE can be purchased once');
  expect(w.eval('fullCardHtml({id:ACE_CARD_IDS[1]}).includes("tc-ace")'),'Owned ACE has special illustrated card category');
  d.getElementById('helpDismiss')?.click();
  w.eval('menuTab="shop";renderMenu()');
  const fusionPack=d.querySelector('[data-action="fusion-pack"]');
  expect(!!fusionPack&&!fusionPack.disabled,'Guaranteed fusion booster available after first tournament win');
  const inventoryBefore=w.eval('Object.values(profile.inventory).reduce((a,b)=>a+b,0)');
  fusionPack?.click();
  const inventoryAfter=w.eval('Object.values(profile.inventory).reduce((a,b)=>a+b,0)');
  expect(inventoryAfter===inventoryBefore+1,'Fusion booster actually grants exactly one card');
  d.getElementById('helpDismiss')?.click();
  w.eval('menuTab="collection";renderMenu()');
  expect(d.querySelector('#cardSearch')!==null&&d.querySelectorAll('.collection-item').length>0,'Main deck has usable filter toolbar');
  expect(!!d.getElementById('arcaneMonsterForge'),'Monster workshop is visible inside deck collection');
  expect(!!d.querySelector('#menuNav [data-royal="forge"]'),'Monster workshop has its own left-navigation entry');
  expect(!!d.querySelector('#arcaneMonsterForge [data-forge-preset="ones"]'),'Workshop offers one-click split presets');
  expect(!!d.querySelector('#arcaneMonsterForge [data-forge-preset="halves"]'),'Workshop offers a balanced split preset');

  const search=d.querySelector('#cardSearch');
  if(search){search.value='kein-monster-mit-diesem-namen';search.dispatchEvent(new w.Event('input',{bubbles:true}));}
  expect([...d.querySelectorAll('.collection-item')].every(x=>x.hidden),'Card search hides nonmatching cards');
  w.eval('menuTab="fusions";renderMenu()');
  expect(d.querySelector('#cardLevel')!==null,'Fusion deck has level filter');
  expect(!!d.querySelector('.collection-item .arcane-role-readout'),'Monster roles appear below card art rather than obscuring the card element');
  const shownCards=[...d.querySelectorAll('.collection-item [data-preview-card]')];
  expect(shownCards.length>=2&&shownCards.every(b=>w.eval('Number(profile.inventory['+Number(b.dataset.previewCard)+']||0)>0')),
   'Fusion deck editor only shows actually owned fusion cards');
  const group=d.querySelector('#menuNav [data-fm-group="deck"]');
  group?.click();
  expect(group?.getAttribute('aria-expanded')==='false'&&group.closest('.fm-menu-group')?.querySelector('.fm-submenu')?.hidden,
   'Pressing active menu group closes its submenu');
  group?.click();
  expect(group?.getAttribute('aria-expanded')==='true'&&!group.closest('.fm-menu-group')?.querySelector('.fm-submenu')?.hidden,
   'Pressing again reopens its submenu');
  if(w.innerWidth>=981)expect(w.getComputedStyle(d.getElementById('menuNav')).overflowY==='auto',
   'Desktop navigation scrolls independently from the menu content');
  w.eval('menuTab="lexicon";renderMenu()');
  expect(d.querySelector('.monster-index')!==null,'Discoverable monster lexicon renders');
  w.eval('menuTab="free";renderMenu()');
  d.querySelector('[data-action="auto-report"]')?.click();
  expect(d.getElementById('modal')?.textContent.includes('AUTOKAMPF-BERICHT'),'Persistent automatic duel report opens');
  d.getElementById('autoReportClose')?.click();
  w.eval('menuTab="free";renderMenu();startDuel("pve",1,"free","easy")');
  expect(d.getElementById('modalGo')?.textContent.includes('DUELL STARTEN'),'Duel start modal available');
  d.dispatchEvent(new w.KeyboardEvent('keydown',{bubbles:true,cancelable:true,key:' ',code:'Space'}));
  expect(d.getElementById('overlay')?.classList.contains('hidden'),'Space starts duel while start modal active');
  // Exercise the actual DOM/CSS cinematic in Chromium (a fixture card is used
  // solely for UI validation; real engine arithmetic is tested in Node).
  w.eval(`game.lastSummoned={id:RPG_START_FUSIONS[0],fusion:true,card:{level:4,atk:470,def:870},
   roleOverride:'guardian',materialsUsed:3,pattern:'Drilling',
   rollTrace:[{atk:440,def:830},{atk:470,def:850}],
   rollMath:{winnerIndex:1,winner:{atk:470,def:850},bonus:{atk:0,def:20},
    penalty:0,final:{atk:470,def:870},role:'guardian'}};
   animationSpeed='fast';
   window.__roleStampSmoke=fusionAnimation(4,[
    {art:CARDS[0].art,level:1},{art:CARDS[1].art,level:1},{art:CARDS[13].art,level:2}]);`);
  expect(!!d.querySelector('.evo-stamp-scene .evo-actual-material img'),
   'Fusion cinema displays actual monster material artwork');
  expect(!!d.querySelector('.evo-stamp-scene .evo-role-seal.evo-seal-guardian'),
   'Defender role appears as a heavy cinematic seal on the resulting monster');
  await w.__roleStampSmoke;
  expect(!d.querySelector('.evo-stamp-scene'),'Fusion cinematic completes and cleans up the overlay');
  w.eval('game.lastSummoned=null');

 }catch(e){pass=false;steps.push('EXCEPTION: '+e.message+' '+(e.stack||'').slice(0,350));}
 r.textContent=steps.join('\n');
 document.body.dataset.uiTest=pass?'pass':'fail';
}, {once:true});
</script></body></html>
