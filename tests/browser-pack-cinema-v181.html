</head><body><main><h1>Booster Cinema – Vorschau</h1><p>Diese Seite zeigt nur die Animation. Es werden keine Karten vergeben und keine Spielstände verändert.</p>

<script src="../assets/pack-cinema-v178.js"></script><script src="../assets/pack-cinema-v181.js"></script>
<script>
const cards=[
 {name:'Nekroth, König des Seelenschwarms',level:1,art:'https://raw.githack.com/2dz28t8rt2-eng/Arcane-Duel/development/assets/custom-art/lv1-necro-hive-illustration.webp'},
 {name:'Nyxar, Klinge des Schwarms',level:7,fusion:true,art:'https://raw.githack.com/2dz28t8rt2-eng/Arcane-Duel/development/assets/custom-art/lv1-attacker-illustration.webp'},
 {name:'Himmlischer Löwenwächter',level:10,ace:true}
];
document.getElementById('three').onclick=()=>ArcanePackCinema181.open(cards,{title:'DEIN CHARAKTERPACK',selection:true});
